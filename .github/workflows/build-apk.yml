name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init FahriAssistant app.fahri.assistant --web-dir=public
      - name: Add Android
        run: |
          echo '{"appId":"app.fahri.assistant","appName":"FahriAssistant","webDir":"public","server":{"url":"https://fahri-assistant.vercel.app","cleartext":true}}' > capacitor.config.json
          npx cap add android
          npx cap sync
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FahriAssistant-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
