name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install deps
        run: |
          npm install --legacy-peer-deps @capacitor/core@6.2.2 @capacitor/cli@6.2.2 @capacitor/android@6.2.2 @capacitor/assets@3.0.1 @capacitor-community/text-to-speech@6.0.0 @capacitor/status-bar@6.0.1 @capacitor-firebase/authentication@6.2.0 @capacitor/app@6.0.2
      - name: Add Android + Fix All
        run: |
          if [ ! -f capacitor.config.json ]; then
            echo '{"appId":"app.fahri.assistant","appName":"Fahri Assistant","webDir":"public"}' > capacitor.config.json
          fi
          mkdir -p assets
          npx cap add android || true
          cp google-services.json android/app/google-services.json
          if ! grep -q "google-services" android/build.gradle; then
            sed -i "s|classpath 'com.android.tools.build:gradle:[^']*'|& \n        classpath 'com.google.gms:google-services:4.4.2'|" android/build.gradle
          fi
          if ! grep -q "google-services" android/app/build.gradle; then
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi
          if [ -f assets/icon.png ]; then
            cp assets/icon.png assets/icon-only.png
            cp assets/icon.png assets/icon-foreground.png
            npx @capacitor/assets generate --android || true
          fi
          MAIN=android/app/src/main/java/app/fahri/assistant/MainActivity.java
          cat > "$MAIN" <<'JAVA'
          package app.fahri.assistant;
          import android.os.Build;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.View;
          import android.view.WindowManager;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            private boolean kbOpen = false;
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              getWindow().setStatusBarColor(Color.TRANSPARENT);
              getWindow().setNavigationBarColor(Color.TRANSPARENT);
              if (Build.VERSION.SDK_INT >= 28) {
                WindowManager.LayoutParams lp = getWindow().getAttributes();
                lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                getWindow().setAttributes(lp);
              }
              ViewCompat.setOnApplyWindowInsetsListener(getWindow().getDecorView(), (v, insets) -> {
                int bottom;
                if (Build.VERSION.SDK_INT >= 30) {
                  bottom = insets.getInsets(WindowInsetsCompat.Type.ime()).bottom;
                } else {
                  int sys = insets.getSystemWindowInsetBottom();
                  int stable = insets.getStableInsetBottom();
                  int min = (int) (80 * getResources().getDisplayMetrics().density);
                  bottom = (sys - stable > min) ? sys : 0;
                }
                View content = findViewById(android.R.id.content);
                if (content != null) content.setPadding(0, 0, 0, bottom);
                boolean open = bottom > 0;
                if (kbOpen && !open) v.post(() -> hideBars());
                kbOpen = open;
                return ViewCompat.onApplyWindowInsets(v, insets);
              });
              hideBars();
            }
            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) hideBars();
            }
            private void hideBars() {
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
              c.hide(WindowInsetsCompat.Type.systemBars());
            }
          }
          JAVA
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fahri-assistant-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
