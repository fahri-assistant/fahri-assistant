name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install deps
        run: |
          npm install --legacy-peer-deps @capacitor/core@6.2.2 @capacitor/cli@6.2.2 @capacitor/android@6.2.2 @capacitor/assets@3.0.1 @capacitor-community/text-to-speech@6.0.0 @capacitor/status-bar@6.0.1 @capacitor-firebase/authentication@6.2.0 @capacitor/app@6.0.2

      - name: Add Android + Edge to Edge + Icon
        run: |
          cp google-services.json android/app/google-services.json || echo "no google-services yet"
          npx cap add android || true
          npx @capacitor/assets generate --android || true
          # Edge to Edge - biar gak ada hitam atas bawah
          sed -i 's/getWindow().setFlags.*/WindowCompat.setDecorFitsSystemWindows(getWindow(), false); getWindow().setStatusBarColor(android.graphics.Color.TRANSPARENT); getWindow().setNavigationBarColor(android.graphics.Color.TRANSPARENT);/' android/app/src/main/java/app/fahri/assistant/MainActivity.java || true
          # Tambah import WindowCompat kalau belum ada
          grep -q "WindowCompat" android/app/src/main/java/app/fahri/assistant/MainActivity.java || sed -i 's/import android.os.Bundle;/import android.os.Bundle;\nimport androidx.core.view.WindowCompat;/' android/app/src/main/java/app/fahri/assistant/MainActivity.java || true
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fahri-assistant-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
