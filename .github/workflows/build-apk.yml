name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install deps
        run: |
          npm install --legacy-peer-deps @capacitor/core@6.2.2 @capacitor/cli@6.2.2 @capacitor/android@6.2.2 @capacitor/assets@3.0.1 @capacitor-community/text-to-speech@6.0.0 @capacitor/status-bar@6.0.1 @capacitor-firebase/authentication@6.2.0 @capacitor/app@6.0.2

      - name: Add Android + Edge to Edge + Icon
        run: |
          # 1. Bikin config kalau belum ada
          if [ ! -f capacitor.config.json ]; then
            echo '{"appId":"app.fahri.assistant","appName":"Fahri Assistant","webDir":"public"}' > capacitor.config.json
          fi
          mkdir -p assets
          # 2. Add android DULU, baru copy google-services
          npx cap add android || true
          cp google-services.json android/app/google-services.json || echo "no google-services yet"
          # 3. Icon - kalau ada icon.png baru generate, kalau gak ada skip biar gak error
          if [ -f assets/icon.png ]; then
            npx @capacitor/assets generate --android || true
          else
            echo "no icon.png, skip"
          fi
          # 4. Edge to Edge
          MAIN=android/app/src/main/java/app/fahri/assistant/MainActivity.java
          if [ -f "$MAIN" ]; then
            grep -q "WindowCompat" "$MAIN" || sed -i 's/import android.os.Bundle;/import android.os.Bundle;\nimport androidx.core.view.WindowCompat;/' "$MAIN" || true
            grep -q "setDecorFitsSystemWindows" "$MAIN" || sed -i 's/super.onCreate.*/super.onCreate(savedInstanceState);\n    WindowCompat.setDecorFitsSystemWindows(getWindow(), false);/' "$MAIN" || true
          fi
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fahri-assistant-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
