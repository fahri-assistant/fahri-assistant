<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fahri Assistant</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:linear-gradient(180deg,#2a0a4a 0%,#4b1a7a 45%,#1a0f2e 100%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  /* HEADER - SAMA KAYAK GAMBAR */
  .header{padding:calc(env(safe-area-inset-top) + 54px) 20px 20px;text-align:left;background:linear-gradient(135deg,#5b1fa8,#2f5fd0);flex-shrink:0;border-radius:28px;margin:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25), inset 0 0 30px rgba(168,85,247,.55), 0 10px 30px rgba(0,0,0,.4)}
  .header-top{display:flex;align-items:center;gap:14px}
  .logo{width:64px;height:64px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,#a855f7,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;box-shadow:0 8px 24px rgba(124,92,255,.4), inset 0 0 18px rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.35)}
  .header h1{font-size:28px;font-weight:800;line-height:1.1}
  .header p{font-size:15px;opacity:.85;margin-top:4px;line-height:1.4}
  .subtitle{color:rgba(255,255,255,.75)!important;opacity:1!important;font-size:14px!important;margin:4px 0 0!important}
  .greet{margin-top:18px!important;font-size:19px!important;font-weight:800!important;opacity:1!important}
  .greet2{font-size:19px!important;font-weight:800!important;opacity:1!important;margin-top:2px!important}
  .badge-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:inset 0 0 14px rgba(168,85,247,.4)}
  /* AUTHBAR - PILL GELAP KAYAK GAMBAR */
  .authbar{margin:0 12px 12px;padding:10px 10px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(20,8,40,.85);border:1px solid rgba(168,85,247,.35);border-radius:999px;flex-shrink:0;box-shadow:inset 0 0 18px rgba(168,85,247,.25)}
  .status-pill{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#c4b5fd}
  .dot{width:9px;height:9px;border-radius:50%;background:#ff4757;box-shadow:0 0 0 3px rgba(255,71,87,.2)}
  .dot.on{background:#2ed573;box-shadow:0 0 0 3px rgba(46,213,115,.2)}
  .login-btns{display:flex;gap:6px}
  .btn{border:0;cursor:pointer;padding:9px 13px;border-radius:999px;font-size:12px;font-weight:700}
  .btn-google{background:#fff;color:#111}
  .btn-github{background:#1f1f2a;color:#fff;border:1px solid rgba(255,255,255,.2)}
  .btn-logout{background:transparent;color:#ff6b81;border:1px solid rgba(255,107,129,.4);padding:6px 10px;font-size:11px}
  .hidden{display:none!important}
  #chat{flex:1;overflow-y:auto;padding:6px 14px 14px;display:flex;flex-direction:column;gap:12px;justify-content:center}
  .welcome{margin:auto 0;display:flex;flex-direction:column;gap:12px;justify-content:center}
  .bubble{max-width:88%;padding:11px 13px;border-radius:16px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .bubble.ai{background:#2a1150;border:1px solid rgba(168,85,247,.5);align-self:flex-start;border-radius:24px;box-shadow:inset 0 0 0 1px rgba(168,85,247,.6), inset 0 0 24px rgba(168,85,247,.35)}
  .welcome .bubble.ai{max-width:92%;margin:0 auto;padding:18px 20px;font-size:15px;width:100%}
  .ai-row{display:flex;gap:12px;align-items:flex-start}
  .mini-logo{width:38px;height:38px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,#a855f7,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;border:1.5px solid rgba(255,255,255,.4)}
  .bubble.user{background:linear-gradient(135deg,#7c5cff,#5a3dff);align-self:flex-end;border-bottom-right-radius:4px;box-shadow:inset 0 0 18px rgba(255,255,255,.2)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;justify-content:space-between}
  .welcome .chips{justify-content:space-between}
  .chip{flex:1;min-width:70px;background:rgba(42,17,80,.9);border:1px solid rgba(168,85,247,.6);color:#e9d5ff;padding:12px 6px;border-radius:18px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:inset 0 0 14px rgba(168,85,247,.35);text-align:center;line-height:1.3}
  /* COMPOSER - PILL + TOMBOL BULAT KAYAK GAMBAR */
  .composer{margin:0 12px 12px;padding:8px 8px 8px 16px;display:flex;gap:10px;background:rgba(30,10,60,.95);border-radius:999px;align-items:center;border:1px solid rgba(168,85,247,.5);flex-shrink:0;box-shadow:inset 0 0 18px rgba(168,85,247,.3);padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .composer input{flex:1;background:transparent;border:0;color:#fff;padding:12px 4px;outline:none;font-size:15px}
  .composer input::placeholder{color:#a78bfa}
  .composer button{background:linear-gradient(135deg,#7c3aed,#2563eb);border:0;color:#fff;width:52px;height:52px;flex-shrink:0;border-radius:50%;font-weight:800;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(124,58,237,.5)}
</style>
 <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f0f0f">
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">F</div>
    <div>
      <h1>Fahri Assistant</h1>
      <p class="subtitle">AI cerdas buatan FahriAI</p>
    </div>
  </div>
  <p class="greet">Selamat pagi,</p>
  <p class="greet2">Mau aku bantu apa hari ini?</p>
  <div class="badge-row">
    <span class="badge">💬 Chat</span>
    <span class="badge">🖼️ Gambar</span>
    <span class="badge">✏️ Edit Foto</span>
  </div>
</div>

<div class="authbar" id="authBar">
  <div class="status-pill" id="statusPill">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Belum login</span>
  </div>
  <div class="login-btns" id="loginBtns">
    <button class="btn btn-google" id="btnGoogle">Login Google</button>
    <button class="btn btn-github" id="btnGithub">Login Github</button>
  </div>
  <button class="btn btn-logout hidden" id="btnLogout">Logout</button>
</div>

<div id="chat">
  <div class="welcome">
    <div class="bubble ai"><div class="ai-row"><div class="mini-logo">F</div><span>Halo! Aku Fahri Assistant buatan FahriAI. Mau tanya apa atau mau dibuatin gambar? Coba ketik "buatkan gambar kucing di pantai" ✨</span></div></div>
    <div class="chips">
      <button class="chip" onclick="quick('Tanya')">✨<br>Tanya</button>
      <button class="chip" onclick="quick('Bikin Gambar')">🎨<br>Bikin Gambar</button>
      <button class="chip" onclick="quick('Gambar Kucing')">🐱<br>Gambar Kucing</button>
      <button class="chip" onclick="quick('Siapa kamu?')">✏️<br>Siapa kamu?</button>
    </div>
  </div>
</div>

<div class="composer">
  <input id="input" placeholder="Tanya apa aja ke Fahri..." autocomplete="off">
  <button id="sendBtn">➤</button>
</div>

<script>
  // Config Firebase - cuma ini yang kamu ganti
  const firebaseConfig = {
    apiKey: "AIzaSyC_enCjCWHSq4GTFHABA6kcCgjWeww1hks",
    authDomain: "fahri-assistant.firebaseapp.com",
    projectId: "fahri-assistant",
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  // Chat - jangan diubah
  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  let history = [];
  function addBubble(text, who){
    const d = document.createElement('div');
    d.className = 'bubble ' + who;
    d.textContent = text;
    chatEl.appendChild(d);
    chatEl.scrollTop = chatEl.scrollHeight;
    return d;
  }
  function quick(t){ inputEl.value = t; send(); }
  async function send(){
    const t = inputEl.value.trim(); if(!t) return;
    addBubble(t, 'user'); inputEl.value = '';
    history.push({role:'user', content:t});
    const loading = addBubble('Fahri lagi mikir...', 'ai');
    try{
      const r = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({messages: history})});
      const d = await r.json();
      loading.textContent = d.reply || 'Maaf, coba lagi ya.';
      history.push({role:'assistant', content: loading.textContent});
    }catch(e){ loading.textContent = 'Maaf, server lagi sibuk, coba lagi ya.'; }
  }
  document.getElementById('sendBtn').onclick = send;
  inputEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter') send(); });
</script>
<script src="auth.js"></script>
 <script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
 </script>
</body>
 </html>
