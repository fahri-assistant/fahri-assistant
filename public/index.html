<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fahri Assistant</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  /* BACKGROUND - HITAM JERNIH, cahaya cuma dari shadow gelembung */
  body{background:#000;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  /* HEADER - DIPERBESAR + WARNA LEBIH PEKAT + SHADOW DITERANGIN LAGI */
  .header{padding:calc(env(safe-area-inset-top) + 24px) 24px 22px;text-align:left;background:linear-gradient(135deg,#a855f7 0%,#7c3aed 42%,#2563eb 100%);flex-shrink:0;border-radius:30px;margin:10px 10px 8px;box-shadow:inset 0 0 0 2px rgba(233,213,255,.95), inset 0 0 52px rgba(216,180,254,.85), 0 0 52px rgba(168,85,247,.75), 0 14px 36px rgba(0,0,0,.6)}
  .header-top{display:flex;align-items:center;gap:16px}
  .logo{width:72px;height:72px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,#d8b4fe,#60a5fa);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;letter-spacing:-1px;box-shadow:inset 0 0 26px rgba(255,255,255,.6), 0 8px 20px rgba(0,0,0,.4);border:2.5px solid rgba(255,255,255,.75)}
  .header h1{font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.02}
  .header p{font-size:16px;opacity:.95;margin-top:4px;line-height:1.4}
  .subtitle{color:#fff!important;opacity:1!important;font-size:15.5px!important;font-weight:600!important;margin:4px 0 0!important;letter-spacing:-.2px}
  .greet{margin-top:20px!important;font-size:24px!important;font-weight:900!important;letter-spacing:-.7px!important;opacity:1!important}
  .greet2{font-size:24px!important;font-weight:900!important;letter-spacing:-.7px!important;opacity:1!important;margin-top:2px!important}
  .badge-row{display:flex;gap:9px;margin-top:17px;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.6);padding:10px 16px;border-radius:999px;font-size:14.5px;font-weight:800;letter-spacing:-.2px;box-shadow:inset 0 0 22px rgba(216,180,254,.7)}
  /* AUTHBAR - DIPERBESAR + LEBIH PEKAT */
  .authbar{margin:0 10px 8px;padding:11px 11px 11px 17px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#12051f;border:2px solid rgba(192,132,252,.8);border-radius:999px;flex-shrink:0;box-shadow:inset 0 0 26px rgba(192,132,252,.5), 0 0 28px rgba(168,85,247,.45)}
  .status-pill{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:800;color:#fff;letter-spacing:-.2px}
  .dot{width:11px;height:11px;border-radius:50%;background:#ff5c7a;box-shadow:0 0 0 3px rgba(255,92,122,.3), 0 0 14px rgba(255,92,122,1)}
  .dot.on{background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.3), 0 0 14px rgba(74,222,128,1)}
  .login-btns{display:flex;gap:7px}
  .btn{border:0;cursor:pointer;padding:11px 15px;border-radius:999px;font-size:13.5px;font-weight:800;letter-spacing:-.2px}
  .btn-google{background:#fff;color:#111;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .btn-github{background:#1f1f2a;color:#fff;border:1px solid rgba(255,255,255,.35)}
  .btn-logout{background:transparent;color:#ff6b81;border:1px solid rgba(255,107,129,.5);padding:7px 11px;font-size:12px}
  .hidden{display:none!important}
  /* CHAT - JARAK ANTAR GELEMBUNG DIRAPETIN, UKURAN DIPERBESAR BIAR LAYAR KEISI */
  #chat{flex:1;overflow-y:auto;padding:8px 12px 10px;display:flex;flex-direction:column;gap:12px;justify-content:flex-start}
  .welcome{display:flex;flex-direction:column;gap:12px;justify-content:flex-start}
  .bubble{max-width:92%;padding:13px 15px;border-radius:18px;font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  /* BUBBLE - LEBIH BESAR + SHADOW PALING TERANG */
  .bubble.ai{background:linear-gradient(180deg,#4c1d95,#2e1065);border:2px solid rgba(216,180,254,.95);align-self:flex-start;border-radius:26px;box-shadow:inset 0 0 0 1.5px rgba(233,213,255,.8), inset 0 0 44px rgba(216,180,254,.7), 0 0 38px rgba(168,85,247,.65)}
  .welcome .bubble.ai{max-width:100%;margin:0 auto;padding:22px 22px;font-size:17.5px;width:100%;font-weight:600;letter-spacing:-.2px;line-height:1.65}
  .ai-row{display:flex;gap:14px;align-items:flex-start}
  .mini-logo{width:48px;height:48px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,#d8b4fe,#60a5fa);display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900;border:2.5px solid rgba(255,255,255,.75);box-shadow:inset 0 0 16px rgba(255,255,255,.5)}
  .bubble.user{background:linear-gradient(135deg,#8b5cf6,#5a3dff);align-self:flex-end;border-bottom-right-radius:4px;box-shadow:inset 0 0 22px rgba(255,255,255,.3)}
  .chips{display:flex;gap:9px;flex-wrap:wrap;margin-top:2px;justify-content:space-between}
  .chip{flex:1;min-width:78px;background:linear-gradient(180deg,#4c1d95,#2e1065);border:2px solid rgba(216,180,254,.85);color:#fff;padding:18px 6px;border-radius:20px;font-size:14px;font-weight:800;letter-spacing:-.2px;cursor:pointer;box-shadow:inset 0 0 26px rgba(216,180,254,.55), 0 0 22px rgba(168,85,247,.5);text-align:center;line-height:1.4}
  /* COMPOSER - DIPERBESAR + LEBIH PEKAT */
  .composer{margin:0 10px 12px;padding:8px 8px 8px 20px;display:flex;gap:10px;background:#12051f;border-radius:999px;align-items:center;border:2px solid rgba(216,180,254,.85);flex-shrink:0;box-shadow:inset 0 0 26px rgba(216,180,254,.5), 0 0 30px rgba(168,85,247,.5);padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .composer input{flex:1;background:transparent;border:0;color:#fff;padding:14px 4px;outline:none;font-size:16.5px;font-weight:600}
  .composer input::placeholder{color:#d8b4fe}
  .composer button{background:linear-gradient(135deg,#c084fc,#3b82f6);border:0;color:#fff;width:58px;height:58px;flex-shrink:0;border-radius:50%;font-weight:900;cursor:pointer;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 20px rgba(255,255,255,.45), 0 8px 20px rgba(168,85,247,.7)}
</style>
 <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">F</div>
    <div>
      <h1>Fahri Assistant</h1>
      <p class="subtitle">AI cerdas buatan FahriAI</p>
    </div>
  </div>
  <p class="greet">Selamat pagi,</p>
  <p class="greet2">Mau aku bantu apa hari ini?</p>
  <div class="badge-row">
    <span class="badge">💬 Chat</span>
    <span class="badge">🖼️ Gambar</span>
    <span class="badge">✏️ Edit Foto</span>
  </div>
</div>

<div class="authbar" id="authBar">
  <div class="status-pill" id="statusPill">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Belum login</span>
  </div>
  <div class="login-btns" id="loginBtns">
    <button class="btn btn-google" id="btnGoogle">Login Google</button>
    <button class="btn btn-github" id="btnGithub">Login Github</button>
  </div>
  <button class="btn btn-logout hidden" id="btnLogout">Logout</button>
</div>

<div id="chat">
  <div class="welcome">
    <div class="bubble ai"><div class="ai-row"><div class="mini-logo">F</div><span>Halo! Aku Fahri Assistant buatan FahriAI. Mau tanya apa atau mau dibuatin gambar? Coba ketik "buatkan gambar kucing di pantai" ✨</span></div></div>
    <div class="chips">
      <button class="chip" onclick="quick('Tanya')">✨<br>Tanya</button>
      <button class="chip" onclick="quick('Bikin Gambar')">🎨<br>Bikin Gambar</button>
      <button class="chip" onclick="quick('Gambar Kucing')">🐱<br>Gambar Kucing</button>
      <button class="chip" onclick="quick('Siapa kamu?')">✏️<br>Siapa kamu?</button>
    </div>
  </div>
</div>

<div class="composer">
  <input id="input" placeholder="Tanya apa aja ke Fahri..." autocomplete="off">
  <button id="sendBtn">➤</button>
</div>

<script>
  // Config Firebase - cuma ini yang kamu ganti
  const firebaseConfig = {
    apiKey: "AIzaSyC_enCjCWHSq4GTFHABA6kcCgjWeww1hks",
    authDomain: "fahri-assistant.firebaseapp.com",
    projectId: "fahri-assistant",
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  // Chat - jangan diubah
  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  let history = [];
  function addBubble(text, who){
    const d = document.createElement('div');
    d.className = 'bubble ' + who;
    d.textContent = text;
    chatEl.appendChild(d);
    chatEl.scrollTop = chatEl.scrollHeight;
    return d;
  }
  function quick(t){ inputEl.value = t; send(); }
  async function send(){
    const t = inputEl.value.trim(); if(!t) return;
    addBubble(t, 'user'); inputEl.value = '';
    history.push({role:'user', content:t});
    const loading = addBubble('Fahri lagi mikir...', 'ai');
    try{
      const r = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({messages: history})});
      const d = await r.json();
      loading.textContent = d.reply || 'Maaf, coba lagi ya.';
      history.push({role:'assistant', content: loading.textContent});
    }catch(e){ loading.textContent = 'Maaf, server lagi sibuk, coba lagi ya.'; }
  }
  document.getElementById('sendBtn').onclick = send;
  inputEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter') send(); });
</script>
<script src="auth.js"></script>
 <script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
 </script>
</body>
       </html>
