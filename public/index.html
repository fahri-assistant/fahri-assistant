<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fahri Assistant</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f0f0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fahri Assistant">
<link rel="apple-touch-icon" href="/icon-192.png">
<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }</script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f0f;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  /* HEADER KECIL - muncul setelah chat mulai */
  #topBar{display:none;padding:10px 16px;background:rgba(20,20,20,.92);backdrop-filter:blur(12px);border-bottom:1px solid #2a2a2a;align-items:center;gap:10px;position:relative;z-index:10}
  #topBar.show{display:flex}
  #topBar .logo{width:34px;height:34px;background:linear-gradient(135deg,#7c3aed,#06b6d4,#f472b6);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;flex-shrink:0}
  #topBar h1{font-size:16px}
  #topBar p{font-size:11px;color:#aaa}
  /* HERO BESAR - di awal */
  #hero{padding:28px 20px 10px;text-align:center;background:radial-gradient(ellipse at top,rgba(124,58,237,.35) 0%,transparent 65%),#0f0f0f;transition:all .4s}
  #hero.hide{display:none}
  #hero .hero-logo{width:84px;height:84px;margin:0 auto 14px;background:linear-gradient(135deg,#7c3aed,#06b6d4,#f472b6);border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;box-shadow:0 10px 30px rgba(124,58,237,.5)}
  #hero h1{font-size:28px;letter-spacing:-.5px;background:linear-gradient(90deg,#fff,#c4b5fd,#67e8f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  #hero p{font-size:13px;color:#aaa;margin-top:6px;line-height:1.5}
  #hero .hero-pill{display:inline-block;margin-top:12px;padding:6px 12px;background:#1f1f1f;border:1px solid #2a2a2a;border-radius:99px;font-size:12px;color:#ddd}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:85%;padding:12px 14px;border-radius:18px;line-height:1.6;font-size:15px;white-space:pre-wrap;word-break:break-word;animation:fade .25s}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .msg.user{align-self:flex-end;background:linear-gradient(135deg,#7c3aed,#6d28d9);border-bottom-right-radius:6px}
  .msg.ai{align-self:flex-start;background:#1f1f1f;border:1px solid #2a2a2a;border-bottom-left-radius:6px}
  .fahri-img-wrap{position:relative;display:inline-block;max-width:100%;margin-top:8px}
  .fahri-img-wrap img{width:100%;max-width:480px;border-radius:12px;display:block}
  .fahri-watermark{position:absolute;bottom:0;right:0;background:#000;color:#fff;font-size:14px;font-weight:bold;padding:6px 14px;border-radius:12px 0 12px 0;letter-spacing:.5px;pointer-events:none}
  .quick{display:flex;gap:8px;flex-wrap:wrap;padding:4px 12px 10px;background:#141414}
  .quick button{padding:8px 13px;border-radius:99px;border:1px solid #333;background:#262626;color:#ddd;font-size:13px;cursor:pointer}
  .mode-btn.active{background:#7c3aed!important;color:#fff!important;border-color:#7c3aed!important}
  #chatForm{display:flex;gap:8px;padding:12px;background:#141414;border-top:1px solid #2a2a2a}
  #chatInput{flex:1;padding:13px 16px;border-radius:24px;border:1px solid #333;background:#262626;color:#fff;outline:none;font-size:15px}
  #chatInput:focus{border-color:#7c3aed}
  #sendBtn{padding:0 20px;border-radius:24px;border:none;background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff;font-weight:bold;cursor:pointer}
  #btnKamera{display:none;padding:0 14px;border:none;border-radius:24px;background:#1A1E35;color:#fff;font-size:20px;cursor:pointer}
  .cursor{display:inline-block;width:7px;height:14px;background:#a78bfa;vertical-align:middle;animation:blink 0.8s infinite}
  @keyframes blink{50%{opacity:0}}
</style>
</head>
<body>

<!-- HEADER KECIL -->
<div id="topBar">
  <div class="logo">F</div>
  <div style="flex:1"><h1>Fahri Assistant</h1><p id="topSubtitle">Online • Selamat malam</p></div>
  <div id="topTime" style="font-size:12px;color:#aaa;text-align:right"></div>
  <div style="width:10px;height:10px;background:#22c55e;border-radius:50%"></div>
</div>

<!-- HERO BESAR DI AWAL -->
<div id="hero">
  <div class="hero-logo">F</div>
  <h1>Fahri Assistant</h1>
  <p id="heroGreet">Selamat malam 👋<br>Mau aku bantu apa hari ini?</p>
  <div class="hero-pill">✨ 14 AI • Gambar • Edit Foto • Gratis</div>
</div>

<div id="chat">
  <div class="msg ai">Halo! Aku Fahri Assistant buatan FahriAI. Mau tanya apa atau mau dibuatin gambar? Coba ketik "buatkan gambar kucing di pantai" ✨</div>
</div>

<div class="quick">
  <button class="mode-btn active" onclick="setMode('chat', this)">💬 Tanya</button>
  <button class="mode-btn" onclick="setMode('gambar', this)">🎨 Bikin Gambar</button>
  <button onclick="quickAsk('buatkan gambar kucing tidur di pantai saat sunset')">🐱 Gambar Kucing</button>
  <button onclick="quickAsk('siapa kamu?')">Siapa kamu?</button>
</div>

<form id="chatForm">
  <button id="btnKamera" type="button">📷</button>
  <input id="chatInput" placeholder="Tanya apa aja ke Fahri..." autocomplete="off" />
  <button id="sendBtn" type="submit">Kirim</button>
</form>
<input id="input" type="hidden" />

<script>
let history = [];
let modeGambar = false;
let chatStarted = false;

function collapseHero(){
  if(chatStarted) return; chatStarted = true;
  document.getElementById('hero').classList.add('hide');
  document.getElementById('topBar').classList.add('show');
}
function setMode(mode, btn){
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  modeGambar = (mode === 'gambar');
  document.getElementById('chatInput').placeholder = modeGambar ? 'Ketik prompt gambar / pilih foto dulu...' : 'Tanya apa aja ke Fahri...';
  document.getElementById('btnKamera').style.display = modeGambar ? 'block' : 'none';
  if(!modeGambar) fotoKu = null;
  updateHeader();
}
function quickAsk(text){ document.getElementById('chatInput').value = text; document.getElementById('chatForm').requestSubmit(); }

function formatReply(text){
  let html = text.replace(/!\[.*?\]\(https?:\/\/[^\s\)]+\)/g, (match) => {
    const url = match.match(/\((https?:\/\/[^\s\)]+)\)/)[1];
    return `<div class="fahri-img-wrap"><img src="${url}" alt="Gambar FahriAI" loading="lazy"><div class="fahri-watermark">FahriAI</div></div>`;
  });
  html = html.replace(/!\[.*?\]\(.*?\)/g, '');
  html = html.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
  return html;
}

async function send(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  collapseHero();
  const chat = document.getElementById('chat');
  const u = document.createElement('div'); u.className='msg user'; u.textContent=text; chat.appendChild(u);
  input.value = '';
  history.push({ role: 'user', content: text });

  // MODE GAMBAR via teks
  if(modeGambar || /buatkan gambar|bikin gambar|gambar.*kucing|lukis|draw/i.test(text) && !fotoKu){
    const loading = document.createElement('div'); loading.className='msg ai'; loading.textContent='Lagi bikin gambarnya...'; chat.appendChild(loading); chat.scrollTop=chat.scrollHeight;
    const img = document.createElement('img');
    img.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?width=512&height=512&nologo=true`;
    img.onload = ()=>{ loading.innerHTML = 'Nih gambarnya: <div class="fahri-img-wrap"><img src="'+img.src+'"><div class="fahri-watermark">FahriAI</div></div>'; };
    img.onerror = ()=>{ loading.textContent='Maaf gambar gagal, coba lagi ya.'; };
    return;
  }

  // CHAT STREAMING - kata per kata
  const loading = document.createElement('div'); loading.className='msg ai'; loading.innerHTML='<span class="cursor"></span>'; chat.appendChild(loading); chat.scrollTop=chat.scrollHeight;
  let full = '';
  try{
    const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json','Accept':'text/event-stream'}, body: JSON.stringify({ messages: history, stream: true }) });
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf='';
    while(true){
      const {done,value} = await reader.read(); if(done) break;
      buf += dec.decode(value,{stream:true});
      const parts = buf.split('\n\n'); buf = parts.pop()||'';
      for(const p of parts){
        const line = p.trim(); if(!line.startsWith('data:')) continue;
        const j = JSON.parse(line.slice(5));
        if(j.chunk){ full += j.chunk; loading.innerHTML = formatReply(full) + '<span class="cursor"></span>'; chat.scrollTop=chat.scrollHeight; }
      }
    }
    if(!full) full = 'Maaf, coba kirim lagi ya.';
    loading.innerHTML = formatReply(full);
    history.push({ role:'assistant', content: full });
  }catch(e){ loading.textContent='Maaf, server lagi sibuk. Coba lagi ya.'; }
  chat.scrollTop=chat.scrollHeight;
}
document.getElementById('chatForm').addEventListener('submit', (e) => { if (fotoKu) return; e.preventDefault(); send(); });
</script>

<script>
let fotoKu = null;
const formKu = document.getElementById('chatForm');
const inputKu = document.getElementById('chatInput');
const btnKamera = document.getElementById('btnKamera');
const inputFoto = document.createElement('input');
inputFoto.type='file'; inputFoto.accept='image/*'; inputFoto.style.display='none';
document.body.appendChild(inputFoto);
btnKamera.onclick = () => inputFoto.click();
inputFoto.onchange = (e) => {
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => { fotoKu = rd.result; inputKu.placeholder='Foto udah kepilih, ketik perintah editnya...'; inputKu.focus(); };
  rd.readAsDataURL(f);
};
formKu.addEventListener('submit', async (e) => {
  if(!fotoKu) return;
  e.preventDefault(); e.stopImmediatePropagation();
  collapseHero();
  const teks = inputKu.value.trim(); if(!teks) return;
  const box = document.getElementById('chat');
  const div = document.createElement('div'); div.className='msg ai'; div.textContent='⏳ Lagi ngedit fotonya...'; box.appendChild(div);
  inputKu.value='';
  try{
    const r = await fetch('/api/image', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ prompt: teks, imageBase64: fotoKu }) });
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    div.innerHTML = 'Ini hasil edit untuk: '+teks+`<div class="fahri-img-wrap"><img src="${d.imageUrl}" style="width:100%;border-radius:12px;"><div class="fahri-watermark">FahriAI</div></div><div style="font-size:12px;color:#aaa;margin-top:6px;">✨ Gambar dibuat oleh FahriAI ✨</div>`;
  }catch(err){ div.textContent='Gagal: '+err.message; }
  fotoKu=null; inputKu.placeholder='Tanya apa aja ke Fahri...';
}, true);
</script>

<script>
function updateHeader(){
  const now = new Date(); const jam = now.getHours();
  let sapa='Selamat malam';
  if(jam>=5 && jam<11) sapa='Selamat pagi';
  else if(jam>=11 && jam<15) sapa='Selamat siang';
  else if(jam>=15 && jam<18) sapa='Selamat sore';
  const jamStr = now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('topTime').innerHTML = sapa+'<br>'+jamStr;
  document.getElementById('heroGreet').innerHTML = sapa+' 👋<br>Mau aku bantu apa hari ini?';
  if(typeof modeGambar!=='undefined' && modeGambar){
    document.getElementById('topSubtitle').textContent='Mode Bikin Gambar • Pilih foto / ketik prompt';
  } else {
    document.getElementById('topSubtitle').textContent='Fahri Assistant • Online • '+sapa;
  }
}
setInterval(updateHeader,1000); updateHeader();
</script>
</body>
   </html>
