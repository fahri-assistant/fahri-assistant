<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080113">
<title>Fahri Assistant</title>
<link rel="manifest" href="/manifest.json">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse 110% 48% at 50% -8%, rgba(196,112,255,.65) 0%, rgba(147,51,234,.28) 32%, transparent 65%), linear-gradient(180deg,#150826 0%,#0b021a 48%,#070112 100%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding-top:14px}
#loader{position:fixed;inset:0;z-index:9999;background:#080113;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s ease}
#loader.hide{opacity:0;pointer-events:none}
#loader .l-logo{width:92px;height:92px;border-radius:50%;background-image:url(logo.png);background-size:cover;background-position:center}
#loader .l-logo::after{content:"";position:absolute;inset:-17px;border-radius:50%;border:2.5px dotted rgba(233,213,255,1);animation:spinRing 9s linear infinite}
#loader .l-text{font-size:22px;font-weight:900;letter-spacing:-.5px}
#loader .l-sub{font-size:13px;color:#c4b5fd;font-weight:600}
#loader .l-bar{width:140px;height:5px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
#loader .l-bar i{display:block;height:100%;width:40%;border-radius:999px;background:linear-gradient(90deg,#a855f7,#d8b4fe);animation:loadBar 1.1s ease-in-out infinite alternate}
@keyframes loadBar{from{transform:translateX(-20%)}to{transform:translateX(260%)}}
.header{padding:calc(env(safe-area-inset-top) + 84px) 28px 26px;text-align:left;background:#0a0218;flex-shrink:0;border-radius:32px;margin:28px 14px 10px;border:2.2px solid rgba(216,180,254,1);box-shadow:inset 0 0 48px rgba(168,85,247,.55), inset 0 0 110px rgba(147,51,234,.30), inset 0 0 22px rgba(216,180,254,.35), 0 0 42px rgba(168,85,247,.75), 0 0 90px rgba(147,51,234,.35);transition:all .35s ease;overflow:hidden;position:relative;z-index:10;animation:headerBreath 4.5s ease-in-out infinite}
@keyframes headerBreath{0%,100%{box-shadow:inset 0 0 48px rgba(168,85,247,.55), inset 0 0 110px rgba(147,51,234,.30), inset 0 0 22px rgba(216,180,254,.35), 0 0 32px rgba(168,85,247,.6), 0 0 70px rgba(147,51,234,.28)}50%{box-shadow:inset 0 0 56px rgba(168,85,247,.7), inset 0 0 120px rgba(147,51,234,.38), inset 0 0 28px rgba(216,180,254,.45), 0 0 48px rgba(168,85,247,.85), 0 0 105px rgba(147,51,234,.45)}}
.header::before{content:"";position:absolute;top:0;right:0;width:180px;height:180px;pointer-events:none;opacity:.35;background-image:radial-gradient(rgba(216,180,254,.55) 1.2px, transparent 1.3px);background-size:14px 14px}
.header.collapsed{padding:calc(env(safe-area-inset-top) + 60px) 20px 14px;border-radius:24px;margin:14px 10px 6px;animation:none}
.header-top{display:flex;align-items:flex-start;gap:30px;transition:all .35s ease;position:relative;z-index:1}
.header-top > div:last-child{margin-left:6px;padding-left:2px}
.logo{width:80px;height:80px;flex-shrink:0;border-radius:50%;background-image:url(logo.png);background-size:cover;background-position:center;color:transparent}
.logo::before{content:"";position:absolute;inset:-19px;border-radius:50%;background:conic-gradient(from 0deg, transparent 0 70%, rgba(233,213,255,1) 78%, #fff 82%, rgba(233,213,255,1) 86%, transparent 94%);-webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));mask:radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));animation:spinGlow 3.5s linear infinite;pointer-events:none}
.logo::after{content:"";position:absolute;inset:-17px;border-radius:50%;border:4.5px dotted rgba(233,213,255,1);box-shadow:0 0 14px rgba(192,132,252,.9);pointer-events:none}
@keyframes spinGlow{to{transform:rotate(360deg)}}
@keyframes spinRing{to{transform:rotate(360deg)}}
.header.collapsed .logo{width:46px;height:46px;font-size:26px;box-shadow:0 0 0 3px #8b5cf6, 0 0 0 5px #a855f7, 0 0 16px rgba(192,132,252,1)}
.header.collapsed .logo::after{inset:-10px}
.header h1{font-size:46px;font-weight:900;letter-spacing:-1.3px;line-height:.92;transition:all .35s ease}
.header.collapsed h1{font-size:28px;letter-spacing:-.8px}
.subtitle{color:#c4b5fd!important;opacity:1!important;font-size:17px!important;font-weight:600!important;margin:8px 0 0!important;transition:all .35s ease}
.header.collapsed .subtitle{font-size:13px!important;margin:3px 0 0!important}
.online-status{display:flex;align-items:center;gap:7px;margin:9px 0 0;font-size:13.5px;font-weight:700;color:#4ade80;transition:all .35s ease;max-height:30px;position:relative;z-index:1}
.online-status .online-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 10px rgba(74,222,128,1);animation:blinkDot 1.8s ease-in-out infinite;flex-shrink:0}
@keyframes blinkDot{0%,100%{opacity:1}50%{opacity:.35}}
.header.collapsed .online-status{margin:4px 0 0;font-size:11.5px}
.greet{margin-top:24px!important;font-size:23px!important;font-weight:800!important;letter-spacing:-.5px!important;opacity:1!important;line-height:1.28;transition:all .35s ease;max-height:100px;position:relative;z-index:1}
.greet2{font-size:23px!important;font-weight:800!important;letter-spacing:-.5px!important;opacity:1!important;margin-top:0!important;line-height:1.28;transition:all .35s ease;max-height:100px;position:relative;z-index:1}
.header.collapsed .greet,.header.collapsed .greet2{margin-top:0!important;font-size:0!important;max-height:0!important;opacity:0!important}
.badge-row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;transition:all .35s ease;max-height:100px;position:relative;z-index:1}
.header.collapsed .badge-row{margin-top:0;max-height:0;opacity:0}
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(8,2,20,.75);border:1.5px solid rgba(168,85,247,.9);padding:11px 16px;border-radius:999px;font-size:15.5px;font-weight:700;color:#fff;box-shadow:0 0 16px rgba(168,85,247,.4)}
.badge i{font-style:normal;font-size:17px;color:#c084fc}
button.badge{font-family:inherit;cursor:pointer;color:#fff}
.authbar{margin:0 14px 0;padding:8px 8px 8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#12051f;border:1.5px solid rgba(168,85,247,.7);border-radius:999px;flex-shrink:0;box-shadow:0 0 22px rgba(168,85,247,.4);position:relative;z-index:10}
.status-pill{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:#a1a1aa}
.dot{width:9px;height:9px;border-radius:50%;background:#f43f5e;box-shadow:0 0 10px rgba(244,63,94,1)}
.dot.on{background:#4ade80;box-shadow:0 0 10px rgba(74,222,128,1)}
.login-btns{display:flex;gap:7px}
.btn{border:0;cursor:pointer;padding:9px 13px;border-radius:999px;font-size:13px;font-weight:600}
.btn-google{background:#fff;color:#111}
.btn-github{background:#1f1f2a;color:#fff;border:1px solid rgba(255,255,255,.22)}
.btn-logout{background:transparent;color:#ff6b81;border:1px solid rgba(255,107,129,.5);padding:6px 10px;font-size:11px}
.hidden{display:none!important}
#chat{flex:1;overflow-y:auto;padding:10px 14px 12px;display:flex;flex-direction:column;gap:12px;justify-content:flex-start;overscroll-behavior:contain;position:relative;background-color:transparent;isolation:isolate}
#chat::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.92;background-image:url("/wallpaper.png");background-size:cover;background-position:center 30%;background-repeat:no-repeat;animation:wallLive 16s ease-in-out infinite alternate}
#chat::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(circle at 85% 18%, rgba(168,85,247,.32) 0, transparent 38%),radial-gradient(circle at 15% 82%, rgba(147,51,234,.26) 0, transparent 35%),radial-gradient(circle at 80% 85%, rgba(192,132,252,.26) 0, transparent 34%),linear-gradient(180deg, rgba(8,1,19,.22), rgba(8,1,19,.28) 50%, rgba(8,1,19,.34));animation:orbLive 5s ease-in-out infinite}
@keyframes wallLive{0%{transform:scale(1) translateY(0);filter:brightness(1.15)}50%{transform:scale(1.06) translateY(-12px);filter:brightness(1.32)}100%{transform:scale(1.02) translateY(8px);filter:brightness(1.12)}}
@keyframes orbLive{0%,100%{opacity:.85}50%{opacity:1}}
.twinkle{position:fixed;inset:0;pointer-events:none;z-index:-1;background-image:radial-gradient(rgba(255,255,255,.95) 1.2px, transparent 1.6px),radial-gradient(rgba(216,180,254,1) 1.5px, transparent 2px),radial-gradient(rgba(192,132,252,1) 1px, transparent 1.5px);background-size:120px 120px,190px 190px,90px 90px;background-position:0 0,40px 60px,80px 20px;animation:twinkle 2.8s ease-in-out infinite alternate;opacity:.75}
@keyframes twinkle{0%{opacity:.35;transform:translateY(0)}50%{opacity:.95}100%{opacity:.45;transform:translateY(-6px)}}
#chat>*{position:relative;z-index:1}
.date-pill{align-self:center;background:rgba(18,5,31,.85);border:1.2px solid rgba(168,85,247,.7);color:#d8b4fe;padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:700;box-shadow:0 0 14px rgba(168,85,247,.3)}
.welcome{display:flex;flex-direction:column;gap:14px;justify-content:flex-start;margin-top:0}
.bubble{max-width:92%;padding:13px 15px;border-radius:18px;font-size:15px;line-height:1.65;white-space:pre-wrap;word-break:break-word;position:relative}
.bubble.ai{background:#0a0218;border:2.5px solid #e9d5ff;align-self:flex-start;border-radius:26px;border-top-left-radius:8px;box-shadow:inset 0 0 42px rgba(168,85,247,.55), inset 0 0 90px rgba(147,51,234,.28), 0 0 34px rgba(192,132,252,.75), 0 0 60px rgba(168,85,247,.35)}
.bubble.ai::before{display:none!important}
.tts-btn{position:absolute;top:8px;right:10px;border:0;background:rgba(255,255,255,.12);color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px}
.tts-btn.playing{background:#a855f7}
body[data-theme="champagne"] .tts-btn.playing{background:#d4af6a;color:#1a1510}
body[data-theme="ivory"] .tts-btn{background:rgba(0,0,0,.08);color:#1a1a1a}
.welcome .bubble.ai{max-width:100%;margin:0 auto;padding:22px 22px;font-size:17.5px;width:100%;font-weight:500;line-height:1.62}
.welcome .bubble.ai::before{display:none}
.ai-row{display:flex;gap:15px;align-items:flex-start}
.mini-logo{width:46px;height:46px;flex-shrink:0;border-radius:50%;background:radial-gradient(circle at 50% 38%, #3b0a6d 0%, #180536 70%);display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900;color:#d8b4fe;box-shadow:0 0 0 4px #8b5cf6, 0 0 0 6.5px #a855f7, 0 0 20px rgba(192,132,252,1)}
.bubble.user{background:linear-gradient(135deg,#8b5cf6,#5a3dff);align-self:flex-end;border-bottom-right-radius:4px;border:2px solid rgba(255,255,255,.35);box-shadow:0 0 22px rgba(139,92,246,.6)}
