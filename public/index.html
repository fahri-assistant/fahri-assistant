<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fahri Assistant</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  /* TEMA - DIPERBAIKI: ada cahaya ungu di tengah kayak contoh */
  body{background:radial-gradient(ellipse 90% 55% at 50% 28%, #6d28d9 0%, #4c1d95 35%, #2e1065 62%, #1a0b2e 100%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  /* HEADER - padding atas dikecilin biar gak cungkring, shadow diterangin */
  .header{padding:calc(env(safe-area-inset-top) + 20px) 22px 20px;text-align:left;background:linear-gradient(135deg,#8b5cf6 0%,#6d28d9 38%,#2563eb 100%);flex-shrink:0;border-radius:28px;margin:12px;box-shadow:inset 0 0 0 1.5px rgba(216,180,254,.85), inset 0 0 42px rgba(192,132,252,.75), 0 0 38px rgba(168,85,247,.55), 0 12px 32px rgba(0,0,0,.45)}
  .header-top{display:flex;align-items:center;gap:14px}
  .logo{width:62px;height:62px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,#c084fc,#60a5fa);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;letter-spacing:-1px;box-shadow:inset 0 0 22px rgba(255,255,255,.45), 0 6px 18px rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.55)}
  /* FONT - DIPERBAIKI: lebih tebel & rapet kayak contoh */
  .header h1{font-size:29px;font-weight:900;letter-spacing:-.8px;line-height:1.05}
  .header p{font-size:15px;opacity:.9;margin-top:4px;line-height:1.4}
  .subtitle{color:rgba(233,213,255,.95)!important;opacity:1!important;font-size:14px!important;font-weight:500!important;margin:3px 0 0!important;letter-spacing:-.2px}
  .greet{margin-top:18px!important;font-size:21px!important;font-weight:900!important;letter-spacing:-.6px!important;opacity:1!important}
  .greet2{font-size:21px!important;font-weight:900!important;letter-spacing:-.6px!important;opacity:1!important;margin-top:1px!important}
  .badge-row{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.45);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:-.2px;box-shadow:inset 0 0 18px rgba(192,132,252,.55)}
  /* AUTHBAR */
  .authbar{margin:0 12px 10px;padding:9px 9px 9px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(24,8,48,.92);border:1.5px solid rgba(168,85,247,.55);border-radius:999px;flex-shrink:0;box-shadow:inset 0 0 22px rgba(168,85,247,.35), 0 0 22px rgba(168,85,247,.25)}
  .status-pill{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:#ddd6fe;letter-spacing:-.2px}
  .dot{width:10px;height:10px;border-radius:50%;background:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.25), 0 0 12px rgba(248,113,113,.8)}
  .dot.on{background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25), 0 0 12px rgba(74,222,128,.8)}
  .login-btns{display:flex;gap:6px}
  .btn{border:0;cursor:pointer;padding:10px 14px;border-radius:999px;font-size:12.5px;font-weight:800;letter-spacing:-.2px}
  .btn-google{background:#fff;color:#111;box-shadow:0 4px 12px rgba(0,0,0,.3)}
  .btn-github{background:#1f1f2a;color:#fff;border:1px solid rgba(255,255,255,.25)}
  .btn-logout{background:transparent;color:#ff6b81;border:1px solid rgba(255,107,129,.4);padding:6px 10px;font-size:11px}
  .hidden{display:none!important}
  /* CHAT - DIPERBAIKI: jarak kosongnya dikurangin, bubble nempel ke bawah kayak contoh */
  #chat{flex:1;overflow-y:auto;padding:10px 14px 12px;display:flex;flex-direction:column;gap:12px;justify-content:flex-end}
  .welcome{display:flex;flex-direction:column;gap:12px;justify-content:flex-end}
  .bubble{max-width:88%;padding:11px 13px;border-radius:16px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  /* BUBBLE - SHADOW DITERANGIN 2x LIPAT */
  .bubble.ai{background:linear-gradient(180deg,#3b1470,#2a1150);border:1.5px solid rgba(192,132,252,.85);align-self:flex-start;border-radius:24px;box-shadow:inset 0 0 0 1px rgba(216,180,254,.7), inset 0 0 34px rgba(192,132,252,.55), 0 0 28px rgba(168,85,247,.45)}
  .welcome .bubble.ai{max-width:100%;margin:0 auto;padding:18px 20px;font-size:15.5px;width:100%;font-weight:500;letter-spacing:-.2px;line-height:1.6}
  .ai-row{display:flex;gap:12px;align-items:flex-start}
  .mini-logo{width:40px;height:40px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,#c084fc,#60a5fa);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:900;border:2px solid rgba(255,255,255,.55);box-shadow:inset 0 0 14px rgba(255,255,255,.35)}
  .bubble.user{background:linear-gradient(135deg,#7c5cff,#5a3dff);align-self:flex-end;border-bottom-right-radius:4px;box-shadow:inset 0 0 18px rgba(255,255,255,.2)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;justify-content:space-between}
  .chip{flex:1;min-width:70px;background:linear-gradient(180deg,#3b1470,#2a1150);border:1.5px solid rgba(192,132,252,.7);color:#f5f3ff;padding:13px 6px;border-radius:18px;font-size:12.5px;font-weight:700;letter-spacing:-.2px;cursor:pointer;box-shadow:inset 0 0 20px rgba(192,132,252,.45), 0 0 16px rgba(168,85,247,.3);text-align:center;line-height:1.35}
  /* COMPOSER - SHADOW DITERANGIN */
  .composer{margin:0 12px 12px;padding:7px 7px 7px 18px;display:flex;gap:10px;background:rgba(35,10,68,.95);border-radius:999px;align-items:center;border:1.5px solid rgba(192,132,252,.7);flex-shrink:0;box-shadow:inset 0 0 22px rgba(192,132,252,.4), 0 0 24px rgba(168,85,247,.35);padding-bottom:calc(7px + env(safe-area-inset-bottom))}
  .composer input{flex:1;background:transparent;border:0;color:#fff;padding:12px 4px;outline:none;font-size:15px;font-weight:500}
  .composer input::placeholder{color:#c4b5fd}
  .composer button{background:linear-gradient(135deg,#a855f7,#3b82f6);border:0;color:#fff;width:54px;height:54px;flex-shrink:0;border-radius:50%;font-weight:800;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 16px rgba(255,255,255,.3), 0 6px 18px rgba(168,85,247,.6)}
</style>
 <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f0f0f">
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">F</div>
    <div>
      <h1>Fahri Assistant</h1>
      <p class="subtitle">AI cerdas buatan FahriAI</p>
    </div>
  </div>
  <p class="greet">Selamat pagi,</p>
  <p class="greet2">Mau aku bantu apa hari ini?</p>
  <div class="badge-row">
    <span class="badge">💬 Chat</span>
    <span class="badge">🖼️ Gambar</span>
    <span class="badge">✏️ Edit Foto</span>
  </div>
</div>

<div class="authbar" id="authBar">
  <div class="status-pill" id="statusPill">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Belum login</span>
  </div>
  <div class="login-btns" id="loginBtns">
    <button class="btn btn-google" id="btnGoogle">Login Google</button>
    <button class="btn btn-github" id="btnGithub">Login Github</button>
  </div>
  <button class="btn btn-logout hidden" id="btnLogout">Logout</button>
</div>

<div id="chat">
  <div class="welcome">
    <div class="bubble ai"><div class="ai-row"><div class="mini-logo">F</div><span>Halo! Aku Fahri Assistant buatan FahriAI. Mau tanya apa atau mau dibuatin gambar? Coba ketik "buatkan gambar kucing di pantai" ✨</span></div></div>
    <div class="chips">
      <button class="chip" onclick="quick('Tanya')">✨<br>Tanya</button>
      <button class="chip" onclick="quick('Bikin Gambar')">🎨<br>Bikin Gambar</button>
      <button class="chip" onclick="quick('Gambar Kucing')">🐱<br>Gambar Kucing</button>
      <button class="chip" onclick="quick('Siapa kamu?')">✏️<br>Siapa kamu?</button>
    </div>
  </div>
</div>

<div class="composer">
  <input id="input" placeholder="Tanya apa aja ke Fahri..." autocomplete="off">
  <button id="sendBtn">➤</button>
</div>

<script>
  // Config Firebase - cuma ini yang kamu ganti
  const firebaseConfig = {
    apiKey: "AIzaSyC_enCjCWHSq4GTFHABA6kcCgjWeww1hks",
    authDomain: "fahri-assistant.firebaseapp.com",
    projectId: "fahri-assistant",
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  // Chat - jangan diubah
  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  let history = [];
  function addBubble(text, who){
    const d = document.createElement('div');
    d.className = 'bubble ' + who;
    d.textContent = text;
    chatEl.appendChild(d);
    chatEl.scrollTop = chatEl.scrollHeight;
    return d;
  }
  function quick(t){ inputEl.value = t; send(); }
  async function send(){
    const t = inputEl.value.trim(); if(!t) return;
    addBubble(t, 'user'); inputEl.value = '';
    history.push({role:'user', content:t});
    const loading = addBubble('Fahri lagi mikir...', 'ai');
    try{
      const r = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({messages: history})});
      const d = await r.json();
      loading.textContent = d.reply || 'Maaf, coba lagi ya.';
      history.push({role:'assistant', content: loading.textContent});
    }catch(e){ loading.textContent = 'Maaf, server lagi sibuk, coba lagi ya.'; }
  }
  document.getElementById('sendBtn').onclick = send;
  inputEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter') send(); });
</script>
<script src="auth.js"></script>
 <script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
 </script>
</body>
 </html>
