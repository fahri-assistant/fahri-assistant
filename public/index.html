<!DOCTYPE html>
<html lang="id">
<head>
<link rel="manifest" href="/manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0D1A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fahri Assistant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#0B0D1A;color:#fff;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{padding:20px 16px 12px;text-align:center;background:linear-gradient(180deg,#141737,#0B0D1A)}
header h1{font-size:26px}header p{font-size:13px;opacity:.6;margin-top:4px}
.modes{display:flex;gap:8px;padding:12px;max-width:720px;width:100%;margin:0 auto}
.modes button{flex:1;padding:12px;border:none;border-radius:14px;font-weight:700;cursor:pointer;font-size:14px}
#btnChat{background:#4F46E5;color:#fff}#btnImage{background:#1A1E35;color:#A5A8C3}
#chatBox{flex:1;max-width:720px;width:100%;margin:0 auto;padding:12px 16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.msg{padding:13px 15px;border-radius:18px;max-width:88%;line-height:1.6;font-size:15px;white-space:pre-wrap;word-break:break-word}
.user{background:#4F46E5;align-self:flex-end;border-bottom-right-radius:4px}
.ai{background:#1A1E35;align-self:flex-start;border:1px solid #262B4A;border-bottom-left-radius:4px}
.ai img{width:100%;border-radius:12px;margin-top:10px;display:block}
.ai a{color:#B4B0FF;overflow-wrap:anywhere}
.input-area{max-width:720px;width:100%;margin:0 auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px;background:#0B0D1A;position:sticky;bottom:0}
input{flex:1;min-width:0;padding:15px 16px;border-radius:16px;border:1px solid #262B4A;background:#141737;color:#fff;outline:none;font-size:15px}
#sendBtn{padding:0 20px;border:none;border-radius:16px;background:#4F46E5;color:#fff;font-weight:700;cursor:pointer}
.suggest{display:flex;gap:8px;flex-wrap:wrap;max-width:720px;width:100%;margin:0 auto;padding:0 16px 8px}
.suggest button{padding:8px 12px;border-radius:20px;border:1px solid #262B4A;background:#141737;color:#C7C9E0;font-size:12px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#accountBar{text-align:center;padding:4px 12px 8px;font-size:12px;color:#C7C9E0}
#splashScreen{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#0B0D1A;transition:opacity .45s ease}
#splashScreen.leaving{opacity:0;pointer-events:none}.splash-center{display:flex;flex-direction:column;align-items:center;gap:24px}
.splash-icon{width:94px;height:94px;border-radius:29px;background:linear-gradient(135deg,#A779FF,#4BA7EE);display:grid;place-items:center;font-size:48px;font-weight:800}.splash-brand{position:absolute;left:12px;right:12px;bottom:36px;text-align:center;font-size:18px;font-weight:700;letter-spacing:4px}
dialog{margin:auto;border:1px solid #262B4A;border-radius:18px;padding:24px;background:#141737;color:white;width:min(90%,380px)}dialog::backdrop{background:#000a}dialog h2{margin-bottom:14px}dialog button{width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1px solid #262B4A;background:#4F46E5;color:white;cursor:pointer}#authStatus{font-size:12px;line-height:1.6;margin-top:14px;color:#FFD27A;white-space:pre-wrap}
</style>
</head>
<body>
<div id="splashScreen"><div class="splash-center"><div class="splash-icon">F</div><p>Menyiapkan ruang percakapan Anda…</p></div><div class="splash-brand">FAHRI ASSISTANT</div></div>
<script>(()=>{const s=document.getElementById('splashScreen');setTimeout(()=>{s.classList.add('leaving');setTimeout(()=>s.remove(),500)},1400)})();</script>
<header><h1 id="headerTitle">✨ Fahri Assistant</h1><p>Asisten Pintar Buatan Fahri</p></header>
<button id="loginBtn" type="button" style="margin:8px auto 0;padding:8px 16px;border:none;border-radius:12px;background:#4F46E5;color:white;font-weight:700;cursor:pointer;display:block;">Masuk / Login</button>
<div id="accountBar"><span id="accountText">Login diperlukan</span> <button id="accountButton" type="button" style="padding:6px 12px;border-radius:20px;border:1px solid #262B4A;background:#141737;color:#C7C9E0;">Masuk</button></div>
<div class="modes"><button id="btnChat" type="button">💬 Chat</button><button id="btnImage" type="button">🎨 Bikin Gambar</button></div>
<div class="suggest" id="suggestBox"><button type="button" data-question="Siapa kamu?">Siapa kamu?</button><button type="button" data-question="Buatkan pantun lucu">Pantun lucu</button><button type="button" data-question="Jelaskan mobil listrik dengan singkat">Mobil listrik</button></div>
<div id="chatBox"><div class="msg ai">Halo! Aku <b>Fahri Assistant</b> 👋<br><br>Login dulu ya, baru bisa chat & bikin gambar.</div></div>
<form class="input-area" id="chatForm"><input id="chatInput" placeholder="Tanya apa aja ke Fahri..." maxlength="6000" autocomplete="off"><button id="sendBtn" type="submit">Kirim</button></form>
<dialog id="loginDialog"><h2>Masuk ke Fahri Assistant</h2><button id="googleLogin" type="button">Lanjutkan dengan Google</button><button id="githubLogin" type="button">Lanjutkan dengan GitHub</button><p id="authStatus">Menyiapkan login...</p><button id="closeLogin" type="button">Tutup</button></dialog>
<script>
const box=document.getElementById('chatBox'),input=document.getElementById('chatInput'),send=document.getElementById('sendBtn');
const chatBtn=document.getElementById('btnChat'),imageBtn=document.getElementById('btnImage'),suggest=document.getElementById('suggestBox');
const dialog=document.getElementById('loginDialog'),accountButton=document.getElementById('accountButton');
let mode='chat',busy=false,history=[];
function add(text,role){const d=document.createElement('div');d.className='msg '+role;d.textContent=text;box.append(d);box.scrollTop=box.scrollHeight;return d}
function setBusy(v){busy=v;send.disabled=v;input.disabled=v;send.textContent=v?'Tunggu...':'Kirim'}
function setMode(v){if(busy)return;mode=v;const c=mode==='chat';chatBtn.style.background=c?'#4F46E5':'#1A1E35';imageBtn.style.background=c?'#1A1E35':'#E11D48';suggest.style.display=c?'flex':'none';input.placeholder=c?'Tanya apa aja ke Fahri...':'Jelaskan gambar yang ingin dibuat...'}
chatBtn.onclick=()=>setMode('chat');imageBtn.onclick=()=>setMode('image');
document.querySelectorAll('[data-question]').forEach(b=>b.onclick=()=>{if(busy)return;setMode('chat');input.value=b.dataset.question;submit()});
document.getElementById('chatForm').onsubmit=e=>{e.preventDefault();submit()};
document.getElementById('closeLogin').onclick=()=>dialog.close();
window.__FAHRI_SET_USER__=function(user){
  window.__FAHRI_USER__=user||null;
  var big=document.getElementById('loginBtn'); if(big) big.style.display=user?'none':'block';
  var bar=document.getElementById('accountBar'); if(bar) bar.style.display=user?'none':'block';
  var t=document.getElementById('accountText'); if(t) t.textContent=user?('Masuk sebagai '+(user.displayName||user.email)):'Login diperlukan';
  accountButton.textContent=user?'Keluar':'Masuk';
  if(user&&dialog.open) dialog.close();
};
accountButton.onclick=()=>{if(window.__FAHRI_USER__){if(confirm('Logout?')) window.__FAHRI_LOGOUT__&&window.__FAHRI_LOGOUT__();}else dialog.showModal();};
document.getElementById('headerTitle').style.cursor='pointer';
document.getElementById('headerTitle').onclick=function(){if(window.__FAHRI_USER__){if(confirm('Logout?')) window.__FAHRI_LOGOUT__&&window.__FAHRI_LOGOUT__();}};
async function submit(){
  if(busy)return; const text=input.value.trim(); if(!text)return;
  if(!window.__FAHRI_USER__){dialog.showModal();return;}
  setBusy(true); input.value=''; add(text,'user');
  const loading=add(mode==='chat'?'⏳ Lagi mikir...':'🎨 Lagi bikin gambar...','ai');

  // Jawab lokal, jangan dikirim ke AI - biar nggak ngawur
  const q=text.toLowerCase();
  if(mode==='chat' && (q.includes('sudah login') || q.includes('apakah saya') || q.includes('siapa saya') || q.includes('login'))){
    const u=window.__FAHRI_USER__;
    loading.textContent = u ? 'Iya, kamu udah login sebagai ' + (u.displayName||u.email) + ' ✅' : 'Kamu belum login. Pencet tombol Masuk / Login dulu ya.';
    setBusy(false); input.focus(); return;
  }
  if(mode==='chat' && (q.includes('siapa kamu') || q==='halo' || q==='hai' || q==='hi')){
    loading.textContent = 'Halo! Aku Fahri Assistant 👋 Asisten pintar buatan Fahri. Aku bisa bantu jawab pertanyaan, bikin pantun, bantu tugas, sampai bikin gambar. Mau dibantu apa?';
    setBusy(false); input.focus(); return;
  }

  try{
    if(mode==='chat'){
      const msgs=[
        {role:'system',content:'Kamu adalah Fahri Assistant, asisten pintar buatan Fahri, ramah, singkat, jawab dalam Bahasa Indonesia.'},
        ...history.slice(-6),
        {role:'user',content:text}
      ];
      let reply='';
      const jalur=[
        async ()=>{
          const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs})});
          if(!r.ok) throw new Error('groq gagal');
          const d=await r.json(); return (d.reply||'').trim();
        },
        async ()=>{
          const r=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai',messages:msgs,temperature:0.7,max_tokens:800})});
          if(!r.ok) throw new Error('jalur2 gagal');
          const d=await r.json(); return (d.choices?.[0]?.message?.content||'').trim();
        },
        async ()=>{
          const r=await fetch('https://text.pollinations.ai/'+encodeURIComponent('Jawab singkat dalam Bahasa Indonesia: '+text));
          if(!r.ok) throw new Error('jalur3 gagal');
          return (await r.text()).trim();
        }
      ];
      for(let i=0;i<jalur.length;i++){
        try{
          reply = await Promise.race([
            jalur[i](),
            new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), 12000))
          ]);
          if(reply) break;
        }catch(e){ /* langsung lanjut jalur berikutnya, tanpa jeda */ }
      }
      if(!reply) throw new Error('AI lagi sibuk sebentar, coba lagi.');
      let bersih = reply.replace(/<br\s*\/?>/gi,'\n').replace(/\*\*/g,'').replace(/<[^>]+>/g,'');
      loading.textContent=bersih; history.push({role:'user',content:text},{role:'assistant',content:bersih});
    } else {
      const url='https://image.pollinations.ai/prompt/'+encodeURIComponent(text)+'?width=1024&height=1024&seed='+Math.floor(Math.random()*999999)+'&nologo=true';
      loading.textContent='Ini hasil untuk: '+text;
      const img=document.createElement('img'); img.alt=text; img.src=url; img.onload=()=>box.scrollTop=box.scrollHeight; img.onerror=()=>{loading.textContent='Gagal bikin gambar, coba deskripsi lain.'}; loading.append(img);
      const a=document.createElement('a'); a.textContent='Buka gambar ukuran penuh'; a.href=url; a.target='_blank'; a.style.display='block'; a.style.marginTop='10px'; loading.append(a);
    }
  }catch(e){ loading.textContent='Maaf, AI lagi sibuk sebentar. Coba kirim lagi ya.'; input.value=text; }
  finally{ setBusy(false); input.focus(); }
}
</script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
(function(){
  function setStatus(m){var el=document.getElementById('authStatus'); if(el) el.textContent=m;}
  var loginBtn=document.getElementById('loginBtn'),loginDialog=document.getElementById('loginDialog');
  if(loginBtn&&loginDialog) loginBtn.onclick=()=>{setStatus('Silakan pilih login Google / GitHub');loginDialog.showModal();};
  setStatus('Menyiapkan login...');
  fetch('/firebase-config.json',{cache:'no-store'}).then(r=>{if(!r.ok) throw new Error('firebase-config.json tidak ketemu (HTTP '+r.status+')');return r.json();}).then(cfg=>{
    if(!cfg.apiKey) throw new Error('firebase-config.json kosong / apiKey tidak ada');
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    var auth=firebase.auth();
    window.__FAHRI_LOGOUT__=function(){return auth.signOut().then(()=>location.reload());};
    // INI YANG KEMAREN KURANG: cek hasil balik dari Google
    auth.getRedirectResult().then(function(result){
      if(result&&result.user){ if(window.__FAHRI_SET_USER__) window.__FAHRI_SET_USER__(result.user); }
    }).catch(function(e){ setStatus('Login gagal: '+(e.message||e.code)); });
    auth.onAuthStateChanged(function(user){
      if(window.__FAHRI_SET_USER__) window.__FAHRI_SET_USER__(user);
      setStatus(user?('Berhasil login sebagai: '+(user.displayName||user.email)):'Auth siap - silakan login');
    });
    function doLogin(provider){
      setStatus('Membuka login Google...');
      // Coba Popup dulu (paling enak di HP), kalau gagal baru Redirect
      auth.signInWithPopup(provider).catch(function(e){
        setStatus('Popup diblokir, pindah ke Redirect... ('+e.code+')');
        return auth.signInWithRedirect(provider);
      }).catch(function(e2){ setStatus('Login gagal: '+(e2.message||e2.code)); });
    }
    document.getElementById('googleLogin').onclick=()=>doLogin(new firebase.auth.GoogleAuthProvider());
    document.getElementById('githubLogin').onclick=()=>doLogin(new firebase.auth.GithubAuthProvider());
  }).catch(function(e){ setStatus('Auth error: '+e.message+'\nCek file firebase-config.json di Vercel kamu'); if(window.__FAHRI_SET_USER__) window.__FAHRI_SET_USER__(null); });
})();
</script>
</body>
  </html>
