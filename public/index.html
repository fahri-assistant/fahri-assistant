<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FahriAI - Fahri Assistant</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #fff; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 16px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; display: flex; align-items: center; gap: 10px; }
  header .logo { width: 38px; height: 38px; background: linear-gradient(135deg,#7c3aed,#06b6d4); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
  header h1 { font-size: 17px; }
  header p { font-size: 12px; color: #aaa; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 12px 14px; border-radius: 16px; line-height: 1.5; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #7c3aed; }
  .msg.ai { align-self: flex-start; background: #1f1f1f; border: 1px solid #2a2a2a; }
  /* === WATERMARK FahriAI === */
  .fahri-img-wrap { position: relative; display: inline-block; max-width: 100%; margin-top: 8px; }
  .fahri-img-wrap img { width: 100%; max-width: 480px; border-radius: 12px; display: block; }
  .fahri-watermark { position: absolute; bottom: 10px; right: 12px; background: rgba(0,0,0,0.6); color: #fff; font-size: 13px; font-weight: bold; padding: 4px 10px; border-radius: 20px; letter-spacing: 0.5px; pointer-events: none; font-family: sans-serif; }
  .fahri-caption { font-size: 12px; color: #aaa; margin-top: 6px; }
  #inputArea { padding: 12px; background: #1a1a1a; border-top: 1px solid #2a2a2a; display: flex; gap: 8px; }
  #input { flex: 1; padding: 12px 14px; border-radius: 24px; border: 1px solid #333; background: #262626; color: #fff; outline: none; font-size: 15px; }
  #sendBtn { padding: 0 20px; border-radius: 24px; border: none; background: #7c3aed; color: #fff; font-weight: bold; cursor: pointer; }
  .quick { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 12px 10px; background: #1a1a1a; }
  .quick button { padding: 7px 12px; border-radius: 20px; border: 1px solid #333; background: #262626; color: #ddd; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <div class="logo">F</div>
  <div><h1>FahriAI</h1><p>Fahri Assistant • Online</p></div>
</header>

<div id="chat">
  <div class="msg ai">Halo! Aku Fahri Assistant buatan FahriAI. Mau tanya apa atau mau dibuatin gambar? Coba ketik "buatkan gambar kucing di pantai" ✨</div>
</div>

<div class="quick">
  <button onclick="quickAsk('buatkan gambar kucing tidur di pantai saat sunset')">🎨 Gambar Kucing</button>
  <button onclick="quickAsk('buatkan gambar kota Jakarta futuristik')">🏙️ Gambar Kota</button>
  <button onclick="quickAsk('siapa kamu?')">Siapa kamu?</button>
</div>

<div id="inputArea">
  <input id="input" placeholder="Tanya apa aja / minta gambar..." onkeydown="if(event.key==='Enter') send()" />
  <button id="sendBtn" onclick="send()">Kirim</button>
</div>

<script>
let history = [];
function quickAsk(text){ document.getElementById('input').value = text; send(); }

function formatReply(text){
  // 1. Gambar + Watermark FahriAI - ini yang bikin watermark nempel di gambar
  let html = text.replace(/!\[.*?\]\(https?:\/\/[^\s\)]+\)/g, (match) => {
    const url = match.match(/\((https?:\/\/[^\s\)]+)\)/)[1];
    return `<div class="fahri-img-wrap"><img src="${url}" alt="Gambar FahriAI" loading="lazy"><div class="fahri-watermark">FahriAI</div></div>`;
  });
  // 2. Hapus sisa markdown gambar biar nggak dobel
  html = html.replace(/!\[.*?\]\(.*?\)/g, '');
  // 3. Bold **teks**
  html = html.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
  return html;
}

async function send(){
  const input = document.getElementById('input');
  const text = input.value.trim();
  if(!text) return;
  const chat = document.getElementById('chat');
  chat.innerHTML += `<div class="msg user">${text}</div>`;
  input.value = '';
  history.push({ role: 'user', content: text });
  const loading = document.createElement('div');
  loading.className = 'msg ai';
  loading.textContent = 'FahriAI lagi mikir...';
  chat.appendChild(loading);
  chat.scrollTop = chat.scrollHeight;

  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: history }) });
    const d = await r.json();
    const reply = d.reply || 'Maaf, lagi sibuk.';
    loading.innerHTML = formatReply(reply);
    history.push({ role: 'assistant', content: reply });
  } catch(e){
    loading.textContent = 'Maaf, server lagi sibuk. Coba lagi ya.';
  }
  chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
    </html>
