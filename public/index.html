<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fahri Assistant</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  /* BACKGROUND - SAMA KAYAK CONTOH: hitam ungu gelap + sinar dari atas tengah */
  body{background:radial-gradient(ellipse 90% 42% at 50% -5%, rgba(168,85,247,.55) 0%, rgba(124,58,237,.22) 28%, transparent 62%), radial-gradient(ellipse 70% 30% at 50% 0%, rgba(168,85,247,.28) 0%, transparent 70%), linear-gradient(180deg,#0d021f 0%,#0a0218 45%,#070112 100%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  /* HEADER - SAMA KAYAK CONTOH: ungu gelap pekat + border neon ungu */
  .header{padding:calc(env(safe-area-inset-top) + 28px) 26px 24px;text-align:left;background:linear-gradient(135deg,#4c1d95 0%,#5b21b6 38%,#2e1065 68%,#1d4ed8 100%);flex-shrink:0;border-radius:32px;margin:14px 14px 10px;box-shadow:0 0 0 1.5px rgba(192,132,252,.95), 0 0 32px rgba(168,85,247,.85), 0 0 62px rgba(168,85,247,.45), 0 14px 36px rgba(0,0,0,.6)}
  .header-top{display:flex;align-items:flex-start;gap:16px}
  /* LOGO - SAMA KAYAK CONTOH: cincin, bukan bulat penuh */
  .logo{width:76px;height:76px;flex-shrink:0;border-radius:50%;background:radial-gradient(circle at 50% 38%, #3b0a6d 0%, #1a0538 68%);display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:900;letter-spacing:-1px;color:#c4b5fd;box-shadow:0 0 0 5px #7c3aed, 0 0 0 8px #a855f7, 0 0 28px rgba(168,85,247,.9)}
  .header h1{font-size:44px;font-weight:900;letter-spacing:-1.2px;line-height:.92}
  .subtitle{color:#c4b5fd!important;opacity:1!important;font-size:16px!important;font-weight:600!important;margin:7px 0 0!important;letter-spacing:-.1px}
  .greet{margin-top:22px!important;font-size:22px!important;font-weight:800!important;letter-spacing:-.5px!important;opacity:1!important;line-height:1.25}
  .greet2{font-size:22px!important;font-weight:800!important;letter-spacing:-.5px!important;opacity:1!important;margin-top:0!important;line-height:1.25}
  /* BADGE - SAMA KAYAK CONTOH: hitam gelap + border ungu tipis */
  .badge-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:8px;background:rgba(10,2,24,.72);border:1.5px solid rgba(168,85,247,.85);padding:10px 15px;border-radius:999px;font-size:15px;font-weight:700;letter-spacing:-.2px;box-shadow:0 0 16px rgba(168,85,247,.35)}
  .badge i{font-style:normal;font-size:16px;color:#c084fc}
  /* AUTHBAR - SAMA KAYAK CONTOH: tipis, kecil, gelap */
  .authbar{margin:0 14px 12px;padding:7px 7px 7px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#12051f;border:1.5px solid rgba(168,85,247,.65);border-radius:999px;flex-shrink:0;box-shadow:0 0 20px rgba(168,85,247,.35)}
  .status-pill{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:#a1a1aa;letter-spacing:-.1px}
  .dot{width:9px;height:9px;border-radius:50%;background:#f43f5e;box-shadow:0 0 10px rgba(244,63,94,.9)}
  .dot.on{background:#4ade80;box-shadow:0 0 10px rgba(74,222,128,.9)}
  .login-btns{display:flex;gap:7px}
  .btn{border:0;cursor:pointer;padding:9px 13px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:-.1px}
  .btn-google{background:#fff;color:#111;box-shadow:0 4px 12px rgba(0,0,0,.4)}
  .btn-github{background:#1f1f2a;color:#fff;border:1px solid rgba(255,255,255,.22)}
  .btn-logout{background:transparent;color:#ff6b81;border:1px solid rgba(255,107,129,.5);padding:6px 10px;font-size:11px}
  .hidden{display:none!important}
  /* CHAT */
  #chat{flex:1;overflow-y:auto;padding:8px 14px 10px;display:flex;flex-direction:column;gap:12px;justify-content:flex-start}
  .welcome{display:flex;flex-direction:column;gap:14px;justify-content:flex-start}
  .bubble{max-width:92%;padding:13px 15px;border-radius:18px;font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  /* BUBBLE AI - SAMA KAYAK CONTOH: gelap + neon ungu */
  .bubble.ai{background:linear-gradient(180deg,#1a0b2e,#150826);border:1.5px solid rgba(192,132,252,.9);align-self:flex-start;border-radius:26px;box-shadow:0 0 0 1px rgba(192,132,252,.35), 0 0 28px rgba(168,85,247,.55)}
  .welcome .bubble.ai{max-width:100%;margin:0 auto;padding:20px 20px;font-size:16.5px;width:100%;font-weight:500;letter-spacing:-.2px;line-height:1.6}
  .ai-row{display:flex;gap:14px;align-items:flex-start}
  .mini-logo{width:44px;height:44px;flex-shrink:0;border-radius:50%;background:radial-gradient(circle at 50% 38%, #3b0a6d 0%, #1a0538 68%);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#c4b5fd;box-shadow:0 0 0 3.5px #7c3aed, 0 0 0 5.5px #a855f7, 0 0 18px rgba(168,85,247,.9)}
  .bubble.user{background:linear-gradient(135deg,#8b5cf6,#5a3dff);align-self:flex-end;border-bottom-right-radius:4px}
  /* CHIPS - SAMA KAYAK CONTOH: 2x2, icon kiri + teks kanan */
  .chips{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:2px}
  .chip{background:rgba(10,2,24,.65);border:1.5px solid rgba(168,85,247,.8);color:#fff;padding:15px 14px;border-radius:16px;font-size:16px;font-weight:600;letter-spacing:-.2px;cursor:pointer;box-shadow:0 0 16px rgba(168,85,247,.28);text-align:left;display:flex;align-items:center;gap:11px;line-height:1.3}
  .chip i{font-style:normal;font-size:21px;color:#c084fc;flex-shrink:0}
  /* COMPOSER - SAMA KAYAK CONTOH: gelap + border ungu tipis */
  .composer{margin:0 14px 14px;padding:6px 6px 6px 20px;display:flex;gap:10px;background:rgba(18,5,31,.92);border-radius:999px;align-items:center;border:1.5px solid rgba(168,85,247,.65);flex-shrink:0;box-shadow:0 0 22px rgba(168,85,247,.32);padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  .composer input{flex:1;background:transparent;border:0;color:#fff;padding:13px 4px;outline:none;font-size:16px;font-weight:500}
  .composer input::placeholder{color:#8b8b9e}
  .composer button{background:linear-gradient(135deg,#a855f7,#3b82f6);border:0;color:#fff;width:50px;height:50px;flex-shrink:0;border-radius:50%;font-weight:900;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(168,85,247,.7)}
</style>
 <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0218">
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">F</div>
    <div>
      <h1>Fahri<br>Assistant</h1>
      <p class="subtitle">AI cerdas buatan FahriAI</p>
    </div>
  </div>
  <p class="greet">Selamat pagi, Mau aku bantu apa</p>
  <p class="greet2">hari ini?</p>
  <div class="badge-row">
    <span class="badge"><i>💬</i> Chat</span>
    <span class="badge"><i>🖼️</i> Gambar</span>
    <span class="badge"><i>✏️</i> Edit Foto</span>
  </div>
</div>

<div class="authbar" id="authBar">
  <div class="status-pill" id="statusPill">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Belum login</span>
  </div>
  <div class="login-btns" id="loginBtns">
    <button class="btn btn-google" id="btnGoogle">G Login Google</button>
    <button class="btn btn-github" id="btnGithub">◉ Login Github</button>
  </div>
  <button class="btn btn-logout hidden" id="btnLogout">Logout</button>
</div>

<div id="chat">
  <div class="welcome">
    <div class="bubble ai"><div class="ai-row"><div class="mini-logo">F</div><span>Halo! Aku Fahri Assistant buatan FahriAI. Mau tanya apa atau mau dibuatin gambar? Coba ketik buatkan gambar kucing di pantai.</span></div></div>
    <div class="chips">
      <button class="chip" onclick="quick('Tanya')"><i>💡</i>Tanya</button>
      <button class="chip" onclick="quick('Bikin Gambar')"><i>✨</i>Bikin Gambar</button>
      <button class="chip" onclick="quick('Gambar Kucing')"><i>🐱</i>Gambar Kucing</button>
      <button class="chip" onclick="quick('Siapa kamu?')"><i>👤</i>Siapa kamu?</button>
    </div>
  </div>
</div>

<div class="composer">
  <input id="input" placeholder="Tanya apa aja ke Fahri..." autocomplete="off">
  <button id="sendBtn">➤</button>
</div>

<script>
  // Config Firebase - cuma ini yang kamu ganti
  const firebaseConfig = {
    apiKey: "AIzaSyC_enCjCWHSq4GTFHABA6kcCgjWeww1hks",
    authDomain: "fahri-assistant.firebaseapp.com",
    projectId: "fahri-assistant",
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  // Chat - jangan diubah
  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  let history = [];
  function addBubble(text, who){
    const d = document.createElement('div');
    d.className = 'bubble ' + who;
    d.textContent = text;
    chatEl.appendChild(d);
    chatEl.scrollTop = chatEl.scrollHeight;
    return d;
  }
  function quick(t){ inputEl.value = t; send(); }
  async function send(){
    const t = inputEl.value.trim(); if(!t) return;
    addBubble(t, 'user'); inputEl.value = '';
    history.push({role:'user', content:t});
    const loading = addBubble('Fahri lagi mikir...', 'ai');
    try{
      const r = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({messages: history})});
      const d = await r.json();
      loading.textContent = d.reply || 'Maaf, coba lagi ya.';
      history.push({role:'assistant', content: loading.textContent});
    }catch(e){ loading.textContent = 'Maaf, server lagi sibuk, coba lagi ya.'; }
  }
  document.getElementById('sendBtn').onclick = send;
  inputEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter') send(); });
</script>
<script src="auth.js"></script>
 <script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
 </script>
</body>
 </html>
