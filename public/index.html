<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fahri Assistant</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="auth.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0a12;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  .header{padding:18px 16px 12px;text-align:center;background:linear-gradient(180deg,#1a1033,#0a0a12);flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.08)}
  .logo{width:56px;height:56px;margin:0 auto 8px;border-radius:16px;background:linear-gradient(135deg,#7c5cff,#00d4ff);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;box-shadow:0 8px 24px rgba(124,92,255,.4)}
  .header h1{font-size:19px;font-weight:800}
  .header p{font-size:12px;opacity:.6;margin-top:3px}
  .badge{display:inline-block;margin-top:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);padding:4px 10px;border-radius:999px;font-size:11px;opacity:.85}
  .authbar{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#111118;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0}
  .status-pill{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;background:#ff4757;box-shadow:0 0 0 3px rgba(255,71,87,.2)}
  .dot.on{background:#2ed573;box-shadow:0 0 0 3px rgba(46,213,115,.2)}
  .login-btns{display:flex;gap:6px}
  .btn{border:0;cursor:pointer;padding:8px 13px;border-radius:999px;font-size:12px;font-weight:700}
  .btn-google{background:#fff;color:#111}
  .btn-github{background:#1f1f2a;color:#fff;border:1px solid rgba(255,255,255,.2)}
  .btn-logout{background:transparent;color:#ff6b81;border:1px solid rgba(255,107,129,.4);padding:6px 10px;font-size:11px}
  .hidden{display:none!important}
  #chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
  .bubble{max-width:88%;padding:11px 13px;border-radius:16px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .bubble.ai{background:#1c1c28;border:1px solid rgba(255,255,255,.08);align-self:flex-start;border-bottom-left-radius:4px}
  .bubble.user{background:linear-gradient(135deg,#7c5cff,#5a3dff);align-self:flex-end;border-bottom-right-radius:4px}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:-4px}
  .chip{background:#1e1e2e;border:1px solid rgba(255,255,255,.12);color:#ddd;padding:7px 11px;border-radius:999px;font-size:12px;cursor:pointer}
  .composer{padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;background:#0f0f18;border-top:1px solid rgba(255,255,255,.08);flex-shrink:0}
  .composer input{flex:1;background:#1e1e2e;border:1px solid rgba(255,255,255,.1);color:#fff;padding:12px 14px;border-radius:999px;outline:none;font-size:14px}
  .composer button{background:linear-gradient(135deg,#7c5cff,#00d4ff);border:0;color:#fff;padding:0 18px;border-radius:999px;font-weight:800;cursor:pointer}
</style>
</head>
<body>

<div class="header">
  <div class="logo">F</div>
  <h1>Fahri Assistant</h1>
  <p>Selamat pagi 👋<br>Mau aku bantu apa hari ini?</p>
  <div class="badge">✨ Chat • Gambar • Edit Foto</div>
</div>

<div class="authbar" id="authBar">
  <div class="status-pill" id="statusPill">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Belum login</span>
  </div>
  <div class="login-btns" id="loginBtns">
    <button class="btn btn-google" id="btnGoogle">Login Google</button>
    <button class="btn btn-github" id="btnGithub">Login Github</button>
  </div>
  <button class="btn btn-logout hidden" id="btnLogout">Logout</button>
</div>

<div id="chat">
  <div class="bubble ai">Halo! Aku Fahri Assistant buatan FahriAI. Mau tanya apa atau mau dibuatin gambar? Coba ketik "buatkan gambar kucing di pantai" ✨</div>
  <div class="chips">
    <button class="chip" onclick="quick('Tanya')">💬 Tanya</button>
    <button class="chip" onclick="quick('Bikin Gambar')">🎨 Bikin Gambar</button>
    <button class="chip" onclick="quick('Gambar Kucing')">🐱 Gambar Kucing</button>
    <button class="chip" onclick="quick('Siapa kamu?')">Siapa kamu?</button>
  </div>
</div>

<div class="composer">
  <input id="input" placeholder="Tanya apa aja ke Fahri..." autocomplete="off">
  <button id="sendBtn">Kirim</button>
</div>

<script>
  // ===== FIREBASE - GANTI CONFIG PUNYAMU DI SINI, JANGAN UBAH YANG LAIN =====
  const firebaseConfig = {
    apiKey: "API_KEY_KAMU",
    authDomain: "PROJECT_KAMU.firebaseapp.com",
    projectId: "PROJECT_KAMU",
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  // ===== PATCH DARI PESAN REDIRECT TADI - JANGAN DIHAPUS =====
  // Biar login Redirect nggak hilang di HP / nggak error missing initial state
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(){});

  // Cek hasil Redirect Google/Github - ini yang bikin dia inget abis balik dari Google
  auth.getRedirectResult().then((res)=>{ if(res && res.user) updateUI(res.user); }).catch(()=>{});

  // ===== SEMBUNYIKAN TOMBOL KALAU UDAH LOGIN, JANGAN TAMPILIN EMAIL =====
  function updateUI(user){
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    const loginBtns = document.getElementById('loginBtns');
    const logout = document.getElementById('btnLogout');
    if(user){
      dot.classList.add('on');
      txt.textContent = 'Terhubung'; // Sengaja nggak tampilin email, biar aman
      loginBtns.classList.add('hidden');
      logout.classList.remove('hidden');
    } else {
      dot.classList.remove('on');
      txt.textContent = 'Belum login';
      loginBtns.classList.remove('hidden');
      logout.classList.add('hidden');
    }
  }

  auth.onAuthStateChanged((user)=>{ updateUI(user); });

  // ===== LOGIN TETAP PAKAI REDIRECT, BUKAN POPUP - SESUAI PESAN REDIRECT TADI =====
  document.getElementById('btnGoogle').onclick = (e)=>{ e.preventDefault(); auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()); };
  document.getElementById('btnGithub').onclick = (e)=>{ e.preventDefault(); auth.signInWithRedirect(new firebase.auth.GithubAuthProvider()); };
  document.getElementById('btnLogout').onclick = ()=>{ auth.signOut(); };

  // ===== CHAT - LOGIKA LAMA, NGGAK DIUBAH =====
  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  let history = [];

  function addBubble(text, who){
    const d = document.createElement('div');
    d.className = 'bubble ' + who;
    d.textContent = text;
    chatEl.appendChild(d);
    chatEl.scrollTop = chatEl.scrollHeight;
    return d;
  }
  function quick(t){ inputEl.value = t; send(); }
  async function send(){
    const t = inputEl.value.trim(); if(!t) return;
    addBubble(t, 'user'); inputEl.value = '';
    history.push({role:'user', content:t});
    const loading = addBubble('Fahri lagi mikir...', 'ai');
    try{
      const r = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({messages: history})});
      const d = await r.json();
      loading.textContent = d.reply || 'Maaf, coba lagi ya.';
      history.push({role:'assistant', content: loading.textContent});
    }catch(e){ loading.textContent = 'Maaf, server lagi sibuk, coba lagi ya.'; }
  }
  document.getElementById('sendBtn').onclick = send;
  inputEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter') send(); });
</script>
</body>
 </html>
