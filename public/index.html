<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f1a">
<title>Fahri Assistant</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{--bg:#0f0f1a;--card:#1a1a2e;--text:#fff;--muted:#a0a0b8;--accent:#7c3aed;--user:#7c3aed;--ai:#23233a;--input:#1e1e32}
[data-theme="terang"]{--bg:#f5f5f7;--card:#ffffff;--text:#111;--muted:#666;--accent:#7c3aed;--user:#7c3aed;--ai:#ececff;--input:#ffffff}
[data-theme="biru"]{--bg:#071426;--card:#0e2a4a;--text:#fff;--muted:#9db8d6;--accent:#2563eb;--user:#2563eb;--ai:#132f52;--input:#0e2a4a}
[data-theme="pink"]{--bg:#1c0f1a;--card:#2a1826;--text:#fff;--muted:#d8a8c8;--accent:#ec4899;--user:#ec4899;--ai:#351f30;--input:#2a1826}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--card);padding:28px 16px 20px;text-align:center;transition:all .25s ease;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
header.small{padding:10px 16px}
header.small .big-title{font-size:18px}
header.small .subtitle, header.small .theme-row{display:none}
header.small .top-row{justify-content:space-between}
.top-row{display:flex;align-items:center;justify-content:center;gap:10px}
.logo{width:38px;height:38px;background:var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.big-title{font-size:28px;font-weight:800;transition:all .25s}
.subtitle{color:var(--muted);font-size:13px;margin-top:4px}
.theme-row{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.theme-row button{background:var(--input);color:var(--text);border:1px solid rgba(255,255,255,.12);padding:6px 12px;border-radius:999px;font-size:12px;cursor:pointer}
.theme-row button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.header-actions{display:flex;gap:6px}
.header-actions button{background:var(--input);color:var(--text);border:1px solid rgba(255,255,255,.12);padding:7px 10px;border-radius:999px;font-size:12px;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 14px;border-radius:16px;line-height:1.5;font-size:15px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--user);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--ai);color:var(--text);border-bottom-left-radius:4px}
.msg.ai .tts{margin-top:8px;background:transparent;border:1px solid rgba(255,255,255,.15);color:var(--text);padding:5px 10px;border-radius:999px;font-size:12px;cursor:pointer}
.empty{text-align:center;color:var(--muted);margin:auto;font-size:14px;padding:20px}
.input-area{padding:12px;background:var(--card);display:flex;gap:8px;border-top:1px solid rgba(255,255,255,.08);padding-bottom:calc(12px + env(safe-area-inset-bottom))}
input{flex:1;background:var(--input);color:var(--text);border:1px solid rgba(255,255,255,.12);padding:13px 16px;border-radius:999px;outline:none;font-size:15px}
button.send{background:var(--accent);color:#fff;border:none;padding:13px 18px;border-radius:999px;font-weight:700;cursor:pointer}
button.send:disabled{opacity:.5}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal-box{background:var(--card);color:var(--text);width:100%;max-height:75vh;border-radius:20px 20px 0 0;padding:18px;overflow-y:auto}
.modal-box h3{margin-bottom:12px}
.log-item{background:var(--input);padding:12px;border-radius:12px;margin-bottom:8px;cursor:pointer;font-size:13px}
.log-item small{color:var(--muted)}
.modal-box .close{width:100%;margin-top:12px;padding:12px;border-radius:999px;border:none;background:var(--accent);color:#fff;font-weight:700}
</style>
</head>
<body>
<header id="header">
  <div class="top-row">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="logo">🤖</div>
      <div style="text-align:left">
        <div class="big-title">Fahri Assistant</div>
        <div class="subtitle">AI kamu, siap bantu kapan aja</div>
      </div>
    </div>
    <div class="header-actions">
      <button onclick="openLog()">📜 Riwayat</button>
      <button onclick="newChat()">＋ Baru</button>
    </div>
  </div>
  <div class="theme-row">
    <button data-t="gelap" onclick="setTheme('gelap')">🌑 Gelap</button>
    <button data-t="terang" onclick="setTheme('terang')">☀️ Terang</button>
    <button data-t="biru" onclick="setTheme('biru')">💙 Biru</button>
    <button data-t="pink" onclick="setTheme('pink')">💗 Pink</button>
  </div>
</header>

<div id="chat"></div>

<div class="input-area">
  <input id="input" placeholder="Tanya apa aja..." onkeydown="if(event.key==='Enter') send()">
  <button class="send" id="sendBtn" onclick="send()">Kirim</button>
</div>

<div class="modal" id="logModal">
  <div class="modal-box">
    <h3>📜 Log Chat</h3>
    <div id="logList"></div>
    <button onclick="clearLogs()" style="width:100%;padding:11px;border-radius:999px;border:1px solid #ef4444;background:transparent;color:#ef4444;margin-top:6px">Hapus Semua Riwayat</button>
    <button class="close" onclick="closeLog()">Tutup</button>
  </div>
</div>

<script>
const chatEl=document.getElementById('chat');
const inputEl=document.getElementById('input');
const headerEl=document.getElementById('header');
const KEY='fahri_chat_v1';
const LOGKEY='fahri_logs_v1';
const THEMEKEY='fahri_theme_v1';
let history=JSON.parse(localStorage.getItem(KEY)||'[]');
let logs=JSON.parse(localStorage.getItem(LOGKEY)||'[]');

function setTheme(t){
  if(t==='gelap') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem(THEMEKEY,t);
  document.querySelectorAll('.theme-row button').forEach(b=>b.classList.toggle('active',b.dataset.t===t));
}
setTheme(localStorage.getItem(THEMEKEY)||'gelap');

function save(){ localStorage.setItem(KEY, JSON.stringify(history)); }
function saveLogs(){ localStorage.setItem(LOGKEY, JSON.stringify(logs)); }

function render(){
  chatEl.innerHTML='';
  if(history.length===0){
    chatEl.innerHTML='<div class="empty">Halo, aku Fahri Assistant.<br>Tanya apa aja, chat kamu ke-save otomatis, nggak gampang ke-reset lagi.</div>';
    return;
  }
  history.forEach(m=>{
    const d=document.createElement('div');
    d.className='msg '+(m.role==='user'?'user':'ai');
    d.textContent=m.content;
    if(m.role==='assistant'){
      const b=document.createElement('button');
      b.className='tts'; b.textContent='🔊 Dengarkan';
      b.onclick=()=>speak(m.content);
      d.appendChild(document.createElement('br'));
      d.appendChild(b);
    }
    chatEl.appendChild(d);
  });
  chatEl.scrollTop=chatEl.scrollHeight;
  checkHeader();
}
function checkHeader(){
  if(chatEl.scrollHeight>chatEl.clientHeight+80 || history.length>3) headerEl.classList.add('small');
  else headerEl.classList.remove('small');
}
chatEl.addEventListener('scroll',()=>{
  if(chatEl.scrollTop>40) headerEl.classList.add('small');
  else if(history.length<=3) headerEl.classList.remove('small');
});

function speak(text){
  if(!('speechSynthesis' in window)){ alert('HP ini belum support Text-to-Speech'); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='id-ID'; u.rate=1;
  speechSynthesis.speak(u);
}

async function send(){
  const text=inputEl.value.trim();
  if(!text) return;
  inputEl.value='';
  history.push({role:'user',content:text});
  render();
  document.getElementById('sendBtn').disabled=true;
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
    const data=await res.json();
    const reply=data.reply||data.choices?.[0]?.message?.content||'Maaf, tidak ada jawaban.';
    history.push({role:'assistant',content:reply});
    save();
    logs.unshift({time:new Date().toLocaleString('id-ID'),preview:text.slice(0,60),data:[...history]});
    logs=logs.slice(0,30);
    saveLogs();
    render();
  }catch(e){
    history.push({role:'assistant',content:'Error koneksi, coba lagi ya.'});
    save(); render();
  }
  document.getElementById('sendBtn').disabled=false;
  inputEl.focus();
}
function newChat(){
  if(history.length===0) return;
  logs.unshift({time:new Date().toLocaleString('id-ID'),preview:history[0]?.content?.slice(0,60)||'Chat',data:[...history]});
  saveLogs();
  history=[]; save(); render();
}
function openLog(){
  const list=document.getElementById('logList');
  if(logs.length===0) list.innerHTML='<p style="color:var(--muted);font-size:13px">Belum ada riwayat.</p>';
  else list.innerHTML=logs.map((l,i)=>`<div class="log-item" onclick="loadLog(${i})"><b>${l.time}</b><br><small>${l.preview}</small><br><span style="color:#7c3aed">Muat ulang chat ini →</span></div>`).join('');
  document.getElementById('logModal').classList.add('open');
}
function closeLog(){ document.getElementById('logModal').classList.remove('open'); }
function loadLog(i){
  history=[...(logs[i].data||[])];
  save(); render(); closeLog();
}
function clearLogs(){ if(confirm('Hapus semua riwayat?')){ logs=[]; saveLogs(); openLog(); } }
render();
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('/sw.js').catch(()=>{}); });
}
</script>
</body>
  </html>
