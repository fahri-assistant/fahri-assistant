<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FahriAI - Fahri Assistant</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #fff; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 16px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; display: flex; align-items: center; gap: 10px; }
  header .logo { width: 38px; height: 38px; background: linear-gradient(135deg,#7c3aed,#06b6d4); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
  header h1 { font-size: 17px; }
  header p { font-size: 12px; color: #aaa; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 12px 14px; border-radius: 16px; line-height: 1.5; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #7c3aed; }
  .msg.ai { align-self: flex-start; background: #1f1f1f; border: 1px solid #2a2a2a; }
  .fahri-img-wrap { position: relative; display: inline-block; max-width: 100%; margin-top: 8px; }
  .fahri-img-wrap img { width: 100%; max-width: 480px; border-radius: 12px; display: block; }
  .fahri-watermark { position: absolute; bottom: 0; right: 0; background: #000; color: #fff; font-size: 14px; font-weight: bold; padding: 6px 14px; border-radius: 12px 0 12px 0; letter-spacing: 0.5px; pointer-events: none; font-family: sans-serif; }
  #inputArea { padding: 12px; background: #1a1a1a; border-top: 1px solid #2a2a2a; display: flex; gap: 8px; }
  #input { flex: 1; padding: 12px 14px; border-radius: 24px; border: 1px solid #333; background: #262626; color: #fff; outline: none; font-size: 15px; }
  #sendBtn { padding: 0 20px; border-radius: 24px; border: none; background: #7c3aed; color: #fff; font-weight: bold; cursor: pointer; }
  .quick { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 12px 10px; background: #1a1a1a; }
  .quick button { padding: 7px 12px; border-radius: 20px; border: 1px solid #333; background: #262626; color: #ddd; font-size: 13px; cursor: pointer; }
  .mode-btn { padding: 7px 14px; border-radius: 20px; border: 1px solid #333; background: #262626; color: #ddd; font-size: 13px; cursor: pointer; }
  .mode-btn.active { background: #7c3aed; color: #fff; border-color: #7c3aed; }
  #btnKamera { display: none; padding: 0 14px; border: none; border-radius: 24px; background: #1A1E35; color: #fff; font-size: 20px; cursor: pointer; }
</style>
</head>
<body>
<header id="mainHeader">
  <div class="logo">F</div>
  <div style="flex:1;">
    <h1 id="headerTitle">FahriAI</h1>
    <p id="headerSubtitle">Fahri Assistant • Online</p>
  </div>
  <div id="headerTime" style="font-size:12px; color:#aaa; text-align:right;"></div>
  <div style="width:10px; height:10px; background:#22c55e; border-radius:50%;"></div>
</header>

<div id="chat">
  <div class="msg ai">Halo! Aku Fahri Assistant buatan FahriAI. Mau tanya apa atau mau dibuatin gambar? Coba ketik "buatkan gambar kucing di pantai" ✨</div>
</div>

<div class="quick">
  <button class="mode-btn active" onclick="setMode('chat', this)">💬 Tanya</button>
  <button class="mode-btn" onclick="setMode('gambar', this)">🎨 Bikin Gambar</button>
  <button onclick="quickAsk('buatkan gambar kucing tidur di pantai saat sunset')">🐱 Gambar Kucing</button>
  <button onclick="quickAsk('siapa kamu?')">Siapa kamu?</button>
</div>

<form id="chatForm" style="display:flex; gap:8px; padding:12px; background:#1a1a1a; border-top:1px solid #2a2a2a;">
  <button id="btnKamera" type="button">📷</button>
  <input id="chatInput" placeholder="Tanya apa aja ke Fahri..." style="flex:1; padding:12px 14px; border-radius:24px; border:1px solid #333; background:#262626; color:#fff; outline:none; font-size:15px;" />
  <button id="sendBtn" type="submit" style="padding:0 20px; border-radius:24px; border:none; background:#7c3aed; color:#fff; font-weight:bold; cursor:pointer;">Kirim</button>
</form>
<input id="input" type="hidden" />

<script>
let history = [];
let modeGambar = false;
function setMode(mode, btn){
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  modeGambar = (mode === 'gambar');
  document.getElementById('chatInput').placeholder = modeGambar ? 'Ketik prompt gambar / pilih foto dulu...' : 'Tanya apa aja ke Fahri...';
  document.getElementById('btnKamera').style.display = modeGambar ? 'block' : 'none';
  if(!modeGambar) fotoKu = null;
  updateHeader();
}
function quickAsk(text){ document.getElementById('chatInput').value = text; document.getElementById('chatForm').requestSubmit(); }

function formatReply(text){
  let html = text.replace(/!\[.*?\]\(https?:\/\/[^\s\)]+\)/g, (match) => {
    const url = match.match(/\((https?:\/\/[^\s\)]+)\)/)[1];
    return `<div class="fahri-img-wrap"><img src="${url}" alt="Gambar FahriAI" loading="lazy"><div class="fahri-watermark">FahriAI</div></div>`;
  });
  html = html.replace(/!\[.*?\]\(.*?\)/g, '');
  html = html.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
  return html;
}

async function send(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  const chat = document.getElementById('chat');
  chat.innerHTML += `<div class="msg user">${text}</div>`;
  input.value = '';
  history.push({ role: 'user', content: text });
  const loading = document.createElement('div');
  loading.className = 'msg ai';
  loading.textContent = 'FahriAI lagi mikir...';
  chat.appendChild(loading);
  chat.scrollTop = chat.scrollHeight;
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: history }) });
    const d = await r.json();
    const reply = d.reply || 'Maaf, lagi sibuk.';
    loading.innerHTML = formatReply(reply);
    history.push({ role: 'assistant', content: reply });
  } catch(e){ loading.textContent = 'Maaf, server lagi sibuk. Coba lagi ya.'; }
  chat.scrollTop = chat.scrollHeight;
}
document.getElementById('chatForm').addEventListener('submit', (e) => {
  if (fotoKu) return;
  e.preventDefault();
  send();
});
</script>

<script>
let fotoKu = null;
const formKu = document.getElementById('chatForm');
const inputKu = document.getElementById('chatInput');
const btnKamera = document.getElementById('btnKamera');
const inputFoto = document.createElement('input');
inputFoto.type = 'file'; inputFoto.accept = 'image/*'; inputFoto.style.display = 'none';
document.body.appendChild(inputFoto);
btnKamera.onclick = () => inputFoto.click();
inputFoto.onchange = (e) => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { fotoKu = rd.result; inputKu.placeholder = 'Foto udah kepilih, ketik perintah editnya...'; inputKu.focus(); };
  rd.readAsDataURL(f);
};
formKu.addEventListener('submit', async (e) => {
  if (!fotoKu) return;
  e.preventDefault(); e.stopImmediatePropagation();
  const teks = inputKu.value.trim(); if (!teks) return;
  const box = document.getElementById('chat');
  const div = document.createElement('div'); div.className = 'msg ai'; div.textContent = '⏳ Lagi ngedit fotonya...'; box.appendChild(div);
  inputKu.value = '';
  try {
    const r = await fetch('/api/image', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt: teks, imageBase64: fotoKu }) });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    div.innerHTML = 'Ini hasil edit untuk: ' + teks + `<div class="fahri-img-wrap"><img src="${d.imageUrl}" style="width:100%;border-radius:12px;"><div class="fahri-watermark">FahriAI</div></div><div style="font-size:12px;color:#aaa;margin-top:6px;">✨ Gambar dibuat oleh FahriAI ✨</div>`;
  } catch (err) { div.textContent = 'Gagal: ' + err.message; }
  fotoKu = null; inputKu.placeholder = 'Tanya apa aja ke Fahri...';
}, true);
</script>

<script>
function updateHeader(){
  const now = new Date(); const jam = now.getHours();
  let sapa = 'Selamat malam';
  if (jam >= 5 && jam < 11) sapa = 'Selamat pagi';
  else if (jam >= 11 && jam < 15) sapa = 'Selamat siang';
  else if (jam >= 15 && jam < 18) sapa = 'Selamat sore';
  document.getElementById('headerTime').innerHTML = sapa + '<br>' + now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  if (typeof modeGambar !== 'undefined' && modeGambar) {
    document.getElementById('headerTitle').textContent = 'FahriAI • Gambar';
    document.getElementById('headerSubtitle').textContent = 'Mode Bikin Gambar • Pilih foto / ketik prompt';
  } else {
    document.getElementById('headerTitle').textContent = 'FahriAI';
    document.getElementById('headerSubtitle').textContent = 'Fahri Assistant • Online • ' + sapa;
  }
}
setInterval(updateHeader, 1000); updateHeader();
</script>
</body>
   </html>
